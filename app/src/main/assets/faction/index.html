<!DOCTYPE html>
<html lang="fr" data-th="grey" data-sg>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Panneau de faction</title>
<!--
  Panneau de faction Crestwood (toutes les factions) : tableau de bord, membres, calendrier, coffre.
  Serveur -> page : FacApp.openFromNative(json) / FacApp.onUpdateFromNative(json)   (dialogues "@fac" 9680-9682)
  Page -> serveur : SampFaction.action(type, {"arg":"..."}) -> /facact <type> <arg>   (SAMP.java, liste blanche)
  Le serveur re-verifie les droits (grade de gestion) a chaque action.
-->
<style>
:root{
  --frame:#33353e; --side:#2a2c34; --main:#363841; --card:#474953; --card2:#4f515b; --right1:#5a5c66; --right2:#45474f;
  --line:rgba(255,255,255,.07); --text:#f4f5f8; --soft:#c9ccd6; --muted:#9a9eab;
  --blue:#8b8b8b; --green:#3ad070; --cyan:#a6a6a6; --amber:#ffb84d; --red:#ff5a6a;
  --accent:#8b8b8b;
  --r-xl:4px; --r-lg:4px; --r-md:4px;
  --font:"Poppins","Montserrat","Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:transparent;font-family:var(--font);color:var(--text);-webkit-user-select:none;user-select:none}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.hidden{display:none!important}
svg{display:block}

.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:2.2vh 2.4vw;background:radial-gradient(ellipse at 50% 50%,rgba(6,8,14,.35),rgba(6,8,14,0.56));animation:fade .2s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* cadre exterieur (bord clair comme sur la capture) + panneau */
.frame{width:min(97vw,1060px);height:min(94vh,620px);padding:clamp(6px,1.6vh,12px);border-radius:4px;
  background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03));box-shadow:0 30px 80px rgba(0,0,0,.55);animation:pop .24s cubic-bezier(.2,.9,.3,1.15)}
@keyframes pop{from{transform:translateY(12px) scale(.97);opacity:.4}to{transform:none;opacity:1}}
.panel{height:100%;display:grid;grid-template-columns:clamp(128px,19%,200px) minmax(0,1fr) clamp(150px,23%,250px);border-radius:var(--r-xl);overflow:hidden;background:var(--frame)}

/* ---------- barre laterale ---------- */
.side{display:flex;flex-direction:column;align-items:center;min-height:0;padding:clamp(10px,3vh,26px) 10px clamp(8px,2.4vh,20px);background:var(--side)}
.logo{position:relative;flex:none;width:clamp(50px,17vh,104px);height:clamp(50px,17vh,104px);border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--accent) 55%,rgba(0,0,0,0.624)),rgba(7,11,24,0.62) 72%);
  box-shadow:0 0 0 3px rgba(255,255,255,.06),0 10px 28px rgba(0,0,0,.45),inset 0 -10px 24px rgba(0,0,0,.4)}
.logo svg{width:44%;height:44%;color:#fff;filter:drop-shadow(0 2px 6px rgba(0,0,0,0.48))}
.logo b{position:absolute;bottom:17%;left:50%;transform:translateX(-50%);font-size:clamp(6px,1.6vh,9px);font-weight:800;letter-spacing:.14em;color:rgba(255,255,255,.75);white-space:nowrap}
.fname{margin:clamp(6px,2vh,16px) 0 clamp(6px,2.6vh,24px);font-size:clamp(13px,3.9vh,20px);font-weight:800;letter-spacing:.04em;text-transform:uppercase;text-align:center;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{width:100%;display:flex;flex-direction:column;gap:clamp(2px,1vh,8px)}
.nav button{display:flex;align-items:center;gap:clamp(8px,1.6vw,14px);width:100%;padding:clamp(6px,1.8vh,13px) clamp(8px,1.4vw,16px);border-radius:4px;
  font-size:clamp(10.5px,2.9vh,14px);font-weight:700;color:var(--soft);transition:background .15s,color .15s}
.nav button svg{width:clamp(16px,4.6vh,24px);height:clamp(16px,4.6vh,24px);flex:none}
.nav button.on{color:var(--blue)}
.nav button.on svg{color:var(--blue)}
.nav button:active{background:rgba(255,255,255,.05)}
.side .quit{margin-top:auto;display:flex;align-items:center;gap:12px;padding:clamp(5px,1.6vh,10px) 14px;border-radius:4px;font-size:clamp(10.5px,2.9vh,14px);font-weight:700;color:var(--soft)}
.side .quit svg{width:clamp(16px,4.6vh,24px);height:clamp(16px,4.6vh,24px)}
.side .quit:active{background:rgba(255,90,106,.15);color:#fff}

/* ---------- zone centrale ---------- */
.main{min-width:0;min-height:0;padding:clamp(6px,1.8vh,12px) 0 clamp(6px,1.8vh,12px) 0;display:flex}
.main-in{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;margin:0 clamp(6px,1vw,10px);padding:clamp(12px,3.4vh,24px) clamp(12px,2vw,24px);border-radius:var(--r-lg);background:var(--main);
  overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.main-in::-webkit-scrollbar{display:none}
.h1{font-size:clamp(15px,4.6vh,24px);font-weight:800;line-height:1.1}
.sub{margin-top:2px;font-size:clamp(9.5px,2.5vh,12.5px);color:var(--soft);font-weight:500}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:clamp(7px,2vh,14px);margin:clamp(10px,3.2vh,22px) 0 clamp(12px,3.6vh,24px)}
.card{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:clamp(50px,15vh,84px);padding:clamp(9px,2.4vh,16px) clamp(12px,1.8vw,20px) clamp(9px,2.4vh,16px) clamp(16px,2.2vw,24px);
  border-radius:var(--r-md);background:linear-gradient(180deg,var(--card2),var(--card));box-shadow:0 8px 20px rgba(0,0,0,.18);text-align:left;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:16%;bottom:16%;width:3px;border-radius:0 3px 3px 0;background:var(--c,var(--blue))}
.card b{display:block;font-size:clamp(11.5px,3.3vh,16px);font-weight:800}
.card small{display:block;margin-top:2px;font-size:clamp(9.5px,2.6vh,13px);color:var(--soft);font-weight:500;white-space:nowrap}
.card .ic{flex:none;color:var(--c,var(--blue))}
.card .ic svg{width:clamp(18px,5.6vh,30px);height:clamp(18px,5.6vh,30px)}
.card .dot{display:block;width:clamp(10px,2.8vh,14px);height:clamp(10px,2.8vh,14px);border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(58,208,112,.18),0 0 12px var(--green)}
button.card:active{transform:scale(.985)}
.sec{font-size:clamp(12px,3.6vh,17px);font-weight:800;margin-bottom:clamp(6px,1.8vh,12px)}
.feed{display:flex;flex-direction:column;gap:clamp(4px,1.2vh,8px)}
.fi{display:flex;align-items:center;gap:10px;padding:clamp(6px,1.7vh,10px) 12px;border-radius:4px;background:rgba(255,255,255,.035)}
.fi i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 8px var(--blue)}
.fi p{flex:1;min-width:0;font-size:clamp(9.5px,2.6vh,12.5px);font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi time{flex:none;font-size:clamp(8.5px,2.2vh,11px);color:var(--muted)}
.empty{padding:clamp(10px,4vh,26px) 0;text-align:center;font-size:clamp(9.5px,2.6vh,12.5px);color:var(--muted)}

/* membres */
.toolbar{display:flex;gap:8px;align-items:center;margin:clamp(8px,2.4vh,16px) 0 clamp(8px,2.2vh,14px)}
.search{flex:1;min-width:0;padding:clamp(6px,1.8vh,10px) 14px;border-radius:4px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:clamp(10px,2.7vh,13px);outline:none;-webkit-user-select:text;user-select:text}
.search:focus{border-color:var(--blue)}
.chip{padding:clamp(5px,1.6vh,9px) 12px;border-radius:3px;font-size:clamp(9px,2.4vh,11.5px);font-weight:700;color:var(--soft);background:rgba(255,255,255,.05);white-space:nowrap}
.chip.on{background:rgba(139,139,139,0.22);color:#fff}
.mrow{display:flex;align-items:center;gap:10px;padding:clamp(6px,1.6vh,10px) 10px;border-radius:4px;background:rgba(255,255,255,.035)}
.mrow + .mrow{margin-top:clamp(4px,1.1vh,7px)}
.av{position:relative;flex:none;width:clamp(28px,8vh,38px);height:clamp(28px,8vh,38px);border-radius:50%;display:grid;place-items:center;background:linear-gradient(160deg,#5d606c,#3f414b);
  font-size:clamp(9.5px,2.6vh,12.5px);font-weight:800}
.av i{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:#70737e;border:2px solid var(--main)}
.av.on i{background:var(--green)}
.who{flex:1;min-width:0}
.who b{display:block;font-size:clamp(10.5px,2.8vh,13.5px);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{font-size:clamp(8.5px,2.3vh,11px);color:var(--soft)}
.rk{flex:none;padding:3px 9px;border-radius:3px;font-size:clamp(8px,2.1vh,10.5px);font-weight:800;color:#e7e7e7;background:rgba(139,139,139,0.2)}
.acts{display:flex;gap:5px}
.ib{width:clamp(24px,6.6vh,32px);height:clamp(24px,6.6vh,32px);border-radius:4px;display:grid;place-items:center;background:rgba(255,255,255,.06);color:var(--soft)}
.ib svg{width:55%;height:55%}
.ib.up{color:var(--green)} .ib.down{color:var(--amber)} .ib.del{color:var(--red)}
.ib:active{transform:scale(.92);background:rgba(255,255,255,.12)}

/* calendrier */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:clamp(8px,2.4vh,16px) 0 clamp(6px,1.8vh,12px)}
.cal-head b{font-size:clamp(11.5px,3.2vh,15px);font-weight:800;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:clamp(3px,.9vh,6px)}
.cal .dn{text-align:center;font-size:clamp(8px,2.1vh,10px);font-weight:700;color:var(--muted);text-transform:uppercase}
.day{position:relative;aspect-ratio:1.5;border-radius:4px;display:grid;place-items:center;font-size:clamp(9.5px,2.6vh,12.5px);font-weight:700;background:rgba(255,255,255,.035);color:var(--soft)}
.day.out{opacity:.25}
.day.today{box-shadow:inset 0 0 0 1.5px var(--blue);color:#fff}
.day.sel{background:var(--blue);color:#fff}
.day.has::after{content:"";position:absolute;bottom:14%;width:5px;height:5px;border-radius:50%;background:var(--cyan)}
.day.sel.has::after{background:#fff}
.evrow{display:flex;align-items:center;gap:10px;padding:clamp(6px,1.7vh,10px) 12px;border-radius:4px;background:rgba(255,255,255,.035)}
.evrow + .evrow{margin-top:6px}
.evd{flex:none;width:clamp(36px,10vh,48px);text-align:center;border-radius:4px;padding:4px 0;background:rgba(166,166,166,0.16);color:var(--cyan)}
.evd b{display:block;font-size:clamp(12px,3.4vh,16px);line-height:1}
.evd small{font-size:clamp(7.5px,1.9vh,9.5px);font-weight:800;text-transform:uppercase}
.form{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-top:clamp(8px,2.4vh,14px)}
.form input{padding:clamp(6px,1.8vh,10px) 12px;border-radius:4px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:clamp(10px,2.7vh,13px);outline:none;color-scheme:dark;-webkit-user-select:text;user-select:text;min-width:0}
.form input:focus{border-color:var(--blue)}
.btn{padding:clamp(6px,1.8vh,10px) 16px;border-radius:4px;font-size:clamp(10px,2.7vh,13px);font-weight:800;background:var(--blue);color:#fff;box-shadow:0 6px 16px rgba(139,139,139,0.35);white-space:nowrap}
.btn.ghost{background:rgba(255,255,255,.07);box-shadow:none;color:var(--text)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.4}

/* ---------- colonne de droite (profil) ---------- */
.right{position:relative;display:flex;flex-direction:column;align-items:center;padding:clamp(14px,4.6vh,32px) clamp(10px,1.6vw,18px) clamp(10px,3vh,20px);
  background:linear-gradient(180deg,var(--right1),var(--right2));min-height:0}
.gear{position:absolute;top:clamp(10px,3vh,18px);right:clamp(10px,1.6vw,18px);color:rgba(255,255,255,.75)}
.gear svg{width:clamp(16px,4.6vh,24px);height:clamp(16px,4.6vh,24px)}
.gear:active{transform:rotate(60deg)}
.me-av{width:clamp(64px,22vh,124px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#ffffff,#dfe1e6);
  color:#3a3d47;font-size:clamp(20px,7vh,40px);font-weight:800;box-shadow:0 12px 30px rgba(0,0,0,.3),0 0 0 5px rgba(255,255,255,.08)}
.me-n{margin-top:clamp(8px,2.6vh,16px);font-size:clamp(13px,4vh,20px);font-weight:800;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-r{margin-top:2px;font-size:clamp(9.5px,2.7vh,13px);color:rgba(255,255,255,.72);font-weight:600;text-align:center}
.prog{position:relative;width:100%;height:4px;margin:clamp(12px,3.6vh,24px) 0 clamp(14px,4vh,26px);border-radius:4px;background:rgba(255,255,255,.18)}
.prog i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,var(--blue),var(--cyan))}
.prog em{position:absolute;top:-15px;width:0;height:0;border-left:7px solid var(--red);border-top:6px solid transparent;border-bottom:6px solid transparent;transform:translateX(-1px)}
.prog em::before{content:"";position:absolute;left:-8px;top:-1px;width:2px;height:20px;background:var(--red);border-radius:2px}
.prog small{position:absolute;right:0;top:8px;font-size:clamp(7.5px,1.9vh,9.5px);color:rgba(255,255,255,.6);font-weight:700}
.nx-h{width:100%;display:flex;align-items:center;justify-content:space-between}
.nx-h b{font-size:clamp(10px,2.8vh,14px);font-weight:800;white-space:nowrap}
.bell{width:clamp(26px,7.4vh,36px);height:clamp(26px,7.4vh,36px);border-radius:50%;display:grid;place-items:center;background:rgba(20,22,28,.55);color:#fff}
.bell svg{width:50%;height:50%}
.nx{width:100%;flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;margin-top:clamp(6px,1.8vh,12px);display:flex;flex-direction:column;gap:6px}
.nx::-webkit-scrollbar{display:none}
.nx .empty{margin:auto 0;color:rgba(255,255,255,.72)}
.nxi{padding:clamp(6px,1.6vh,9px) 10px;border-radius:4px;background:rgba(20,22,28,.28)}
.nxi b{display:block;font-size:clamp(9.5px,2.6vh,12.5px);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nxi small{font-size:clamp(8px,2.1vh,10.5px);color:rgba(255,255,255,.7)}

/* fenetre du coffre */
.sheet{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,8,14,.55);z-index:5;animation:fade .15s}
.sheet-in{width:min(90vw,380px);padding:clamp(14px,3.6vh,22px);border-radius:4px;background:var(--main);box-shadow:0 24px 60px rgba(0,0,0,0.48);border:1px solid var(--line)}
.sheet-in h3{font-size:clamp(13px,3.8vh,18px);font-weight:800}
.sheet-in p{margin:4px 0 clamp(8px,2.4vh,14px);font-size:clamp(9.5px,2.6vh,12.5px);color:var(--soft)}
.sheet-in .big{font-size:clamp(20px,6.4vh,32px);font-weight:800;color:var(--green);margin-bottom:clamp(8px,2.4vh,14px)}
.sheet-in input{width:100%;padding:clamp(7px,2vh,11px) 12px;border-radius:4px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:clamp(11px,3vh,14px);outline:none;-webkit-user-select:text;user-select:text}
.sheet-in .row{display:flex;gap:8px;margin-top:10px}
.sheet-in .row .btn{flex:1}

.toast{position:fixed;left:50%;bottom:4vh;transform:translateX(-50%);max-width:80vw;padding:clamp(7px,2vh,11px) 18px;border-radius:4px;font-size:clamp(10px,2.7vh,13px);font-weight:700;
  background:rgba(22,60,38,0.62);color:#bff5d2;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:9;animation:fade .15s}
.toast.err{background:rgba(70,20,26,0.62);color:#ffc9cf}

@media (max-width:620px){ .panel{grid-template-columns:clamp(110px,24%,150px) minmax(0,1fr)} .right{display:none} }
</style>

    <symbol id="i-left" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="m15 6-6 6 6 6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="m9 6 6 6-6 6"/></symbol>
    <!-- emblemes par type de faction -->
    <symbol id="e-police" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Zm0 5 1.3 2.7 3 .4-2.2 2.1.5 3L12 13.8l-2.6 1.4.5-3-2.2-2.1 3-.4L12 7Z"/></symbol>
    <symbol id="e-medic" viewBox="0 0 24 24"><path fill="currentColor" d="M9 2h6v7h7v6h-7v7H9v-7H2V9h7V2Z"/></symbol>
    <symbol id="e-government" viewBox="0 0 24 24"><path fill="currentColor" d="m12 2 10 5v2H2V7l10-5ZM4 10h3v8H4v-8Zm6.5 0h3v8h-3v-8ZM17 10h3v8h-3v-8ZM2 19h20v3H2v-3Z"/></symbol>
    <symbol id="e-mechanic" viewBox="0 0 24 24"><path fill="currentColor" d="M21 7.5a5.5 5.5 0 0 1-7.4 5.2l-7.4 7.4a2 2 0 0 1-2.8-2.8l7.4-7.4A5.5 5.5 0 0 1 17.9 2l-3.2 3.2.6 3.4 3.4.6L21.9 6c-.6.5-.9 1-.9 1.5Z"/></symbol>
    <symbol id="e-news" viewBox="0 0 24 24"><path fill="currentColor" d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1Zm12-2a4 4 0 0 1 0 6l1.4 1.4a6 6 0 0 0 0-8.8L15 9Zm2.8-2.8a8 8 0 0 1 0 11.3l1.4 1.4a10 10 0 0 0 0-14.1l-1.4 1.4Z"/></symbol>
    <symbol id="e-default" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Z"/></symbol>
  </defs>
</svg>

<main class="ov" id="ov">
  <div class="frame">
    <div class="panel">
      <aside class="side">
        <div class="logo" id="logo"><svg><use id="logoUse" href="#e-default"/></svg><b id="logoS">CRESTWOOD</b></div>
        <div class="fname" id="fname">—</div>
        <nav class="nav" id="nav">
          <button type="button" data-view="dash" class="on"><svg><use href="#i-dash"/></svg>Dashboard</button>
          <button type="button" data-view="members"><svg><use href="#i-users"/></svg>Membres</button>
          <button type="button" data-view="events"><svg><use href="#i-cal"/></svg>Calendrier</button>
        </nav>
        <button type="button" class="quit" id="quit"><svg><use href="#i-out"/></svg>Fermer</button>
      </aside>

      <section class="main"><div class="main-in" id="mainIn"></div></section>

      <aside class="right">
        <button type="button" class="gear" id="gear" aria-label="Actualiser"><svg><use href="#i-gear"/></svg></button>
        <div class="me-av" id="meAv">?</div>
        <div class="me-n" id="meN">—</div>
        <div class="me-r" id="meR">—</div>
        <div class="prog" id="prog"><i id="progBar"></i><em id="progFlag"></em><small id="progTxt"></small></div>
        <div class="nx-h"><b>Prochains événements</b><button type="button" class="bell" id="bell" aria-label="Calendrier"><svg><use href="#i-bell"/></svg></button></div>
        <div class="nx" id="nx"></div>
      </aside>
    </div>
  </div>
</main>

<div class="sheet hidden" id="sheet"><div class="sheet-in">
  <h3>Coffre de la faction</h3>
  <p id="sheetSub">Dépose ton argent liquide ; le retrait est réservé aux grades de gestion.</p>
  <div class="big" id="sheetBal">0 $</div>
  <input id="sheetAmt" type="number" inputmode="numeric" min="1" placeholder="Montant ($)">
  <div class="row"><button type="button" class="btn" id="dep">Déposer</button><button type="button" class="btn ghost" id="wd">Retirer</button></div>
  <div class="row"><button type="button" class="btn ghost" id="sheetClose">Fermer</button></div>
</div></div>
<div class="toast hidden" id="toast" role="status"></div>

<script>
(function () {
  "use strict";
  const bridge = window.SampFaction || null;
  const $ = (id) => document.getElementById(id);
  const S = { view: "dash", fac: {}, me: {}, st: {}, log: [], next: [], members: [], events: [], q: "", onlyOn: false, month: null, sel: null, busy: 0 };
  const TYPE_NAMES = { police: "Police", medic: "Médical", news: "Presse", government: "Gouvernement", hitman: "Agence", federal: "FBI", mechanic: "Mécanique", terrorist: "Organisation", army: "Armée", cardealer: "Concession", burger: "Restauration", taxi: "Taxi" };
  const EMBLEM = { police: "e-police", federal: "e-police", army: "e-police", medic: "e-medic", government: "e-government", mechanic: "e-mechanic", news: "e-news" };

  function parse(raw) { if (raw && typeof raw === "object") return raw; try { return JSON.parse(raw || "{}") || {}; } catch (_) { return {}; } }
  function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; }
  function use(id) { const ns = "http://www.w3.org/2000/svg"; const s = document.createElementNS(ns, "svg"); const u = document.createElementNS(ns, "use"); u.setAttribute("href", "#" + id); s.appendChild(u); return s; }
  function nice(n) { return String(n || "").replace(/_/g, " "); }
  function initials(n) { return nice(n).split(" ").filter(Boolean).slice(0, 2).map((w) => w[0]).join("").toUpperCase() || "?"; }
  function money(n) { return (Number(n) || 0).toLocaleString("fr-FR").replace(/[  ]/g, " ") + " $"; }
  function ago(ts) {
    const s = Math.max(0, Date.now() / 1000 - Number(ts || 0));
    if (s < 60) return "à l'instant"; if (s < 3600) return Math.floor(s / 60) + " min";
    if (s < 86400) return Math.floor(s / 3600) + " h"; return Math.floor(s / 86400) + " j";
  }
  function when(ts) {
    const d = new Date(Number(ts) * 1000);
    return d.toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" }) + " · " + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  }
  function dayKey(d) { return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate(); }

  function send(type, arg) {
    const payload = JSON.stringify({ arg: arg == null ? "" : String(arg) });
    if (bridge && typeof bridge.action === "function") { try { bridge.action(type, payload); } catch (_) {} }
    else console.log("[faction]", type, payload);
  }
  let tt = 0;
  function toast(msg, ok) {
    if (!msg) return;
    const t = $("toast"); t.textContent = msg; t.classList.toggle("err", !ok); t.classList.remove("hidden");
    clearTimeout(tt); tt = setTimeout(() => t.classList.add("hidden"), 3000);
  }

  /* ---------- en-tete commun ---------- */
  function renderFrame() {
    const f = S.fac, me = S.me;
    const col = /^[0-9a-f]{6}$/i.test(f.c || "") && f.c !== "000000" ? "#" + f.c : "#4d82ff";
    document.documentElement.style.setProperty("--accent", col);
    $("logoUse").setAttribute("href", "#" + (EMBLEM[f.t] || "e-default"));
    $("logoS").textContent = (TYPE_NAMES[f.t] || "Faction").toUpperCase();
    $("fname").textContent = (f.s && f.s !== "None" ? f.s : f.n) || "Faction";
    $("meAv").textContent = initials(me.n);
    $("meN").textContent = nice(me.n) || "—";
    $("meR").textContent = me.rn || "—";
    const rc = Math.max(1, Number(f.rc) || 1), r = Math.min(rc, Math.max(1, Number(me.r) || 1));
    const pct = rc > 1 ? ((r - 1) / (rc - 1)) * 100 : 100;
    $("progBar").style.width = pct + "%";
    $("progFlag").style.left = pct + "%";
    $("progTxt").textContent = "Grade " + r + " / " + rc;
    document.querySelectorAll("#nav button").forEach((b) => b.classList.toggle("on", b.dataset.view === S.view));
    const nx = $("nx"); nx.replaceChildren();
    if (!S.next.length) nx.appendChild(el("p", "empty", "Aucun événement à venir"));
    S.next.forEach((e) => { const it = el("div", "nxi"); it.appendChild(el("b", "", e[2])); it.appendChild(el("small", "", when(e[1]))); nx.appendChild(it); });
  }

  /* ---------- vues ---------- */
  function head(title, sub) {
    const m = $("mainIn"); m.replaceChildren();
    m.appendChild(el("div", "h1", title)); m.appendChild(el("div", "sub", sub));
    return m;
  }

  function card(title, sub, color, icon, onClick) {
    const c = el(onClick ? "button" : "div", "card");
    if (onClick) { c.type = "button"; c.addEventListener("click", onClick); }
    c.style.setProperty("--c", color);
    const t = el("div"); t.appendChild(el("b", "", title)); t.appendChild(el("small", "", sub)); c.appendChild(t);
    const ic = el("span", "ic");
    if (icon === "dot") ic.appendChild(el("i", "dot")); else ic.appendChild(use(icon));
    c.appendChild(ic);
    return c;
  }

  function viewDash() {
    const m = head("Dashboard", "Vue d'ensemble de la faction et des événements");
    const st = S.st || {};
    const cards = el("div", "cards");
    cards.appendChild(card("Membres", (Number(st.m) || 0) + " membre(s)", "var(--blue)", "i-users", () => go("members")));
    cards.appendChild(card("En ligne", (Number(st.on) || 0) + " membre(s) en ligne", "var(--green)", "dot", () => { S.onlyOn = true; go("members"); }));
    cards.appendChild(card("Coffre", money(st.bal), "var(--blue)", "i-money", openSheet));
    cards.appendChild(card("Événements", (Number(st.ev) || 0) + " événement(s)", "var(--cyan)", "i-bell", () => go("events")));
    m.appendChild(cards);
    m.appendChild(el("div", "sec", "Dernières activités"));
    const feed = el("div", "feed");
    if (!S.log.length) feed.appendChild(el("p", "empty", "Aucune activité pour le moment."));
    S.log.forEach((l) => { const r = el("div", "fi"); r.appendChild(el("i")); r.appendChild(el("p", "", nice(l[1]))); r.appendChild(el("time", "", ago(l[0]))); feed.appendChild(r); });
    m.appendChild(feed);
  }

  function viewMembers() {
    const m = head("Membres", (S.members.length) + " membre(s) · " + S.members.filter((x) => Number(x[3])).length + " en ligne");
    const tb = el("div", "toolbar");
    const s = el("input", "search"); s.type = "search"; s.placeholder = "Rechercher un membre"; s.value = S.q;
    s.addEventListener("input", () => { S.q = s.value; list(); });
    const ch = el("button", "chip" + (S.onlyOn ? " on" : ""), "En ligne"); ch.type = "button";
    ch.addEventListener("click", () => { S.onlyOn = !S.onlyOn; ch.classList.toggle("on", S.onlyOn); list(); });
    tb.appendChild(s); tb.appendChild(ch); m.appendChild(tb);
    const box = el("div"); m.appendChild(box);
    const mg = Number(S.me.mg) === 1, myRank = Number(S.me.r) || 1, ld = Number(S.me.ld) === 1, rc = Number(S.fac.rc) || 1;
    function list() {
      box.replaceChildren();
      const q = S.q.trim().toLowerCase();
      const rows = S.members.filter((x) => (!S.onlyOn || Number(x[3])) && (!q || nice(x[0]).toLowerCase().includes(q)));
      if (!rows.length) { box.appendChild(el("p", "empty", "Aucun membre.")); return; }
      rows.forEach((x) => {
        const [name, rank, rn, on] = x;
        const r = el("div", "mrow");
        const av = el("div", "av" + (Number(on) ? " on" : ""), initials(name)); av.appendChild(el("i")); r.appendChild(av);
        const w = el("div", "who"); w.appendChild(el("b", "", nice(name))); w.appendChild(el("small", "", Number(on) ? "En ligne" : "Hors ligne")); r.appendChild(w);
        r.appendChild(el("span", "rk", rn + " · " + rank));
        const isMe = nice(name).toLowerCase() === nice(S.me.n).toLowerCase();
        if (mg && !isMe && (ld || Number(rank) < myRank)) {
          const a = el("div", "acts");
          const mk = (cls, icon, act, label) => { const b = el("button", "ib " + cls); b.type = "button"; b.title = label; b.appendChild(use(icon)); b.addEventListener("click", () => act()); return b; };
          if (Number(rank) < rc && (ld || Number(rank) + 1 < myRank)) a.appendChild(mk("up", "i-up", () => send("promote", name), "Promouvoir"));
          if (Number(rank) > 1) a.appendChild(mk("down", "i-down", () => send("demote", name), "Rétrograder"));
          a.appendChild(mk("del", "i-x", () => confirmKick(name), "Renvoyer"));
          r.appendChild(a);
        }
        box.appendChild(r);
      });
    }
    list();
  }

  let kickArm = "", kickT = 0;
  function confirmKick(name) {
    if (kickArm === name) { kickArm = ""; send("kick", name); return; }
    kickArm = name; clearTimeout(kickT); kickT = setTimeout(() => (kickArm = ""), 3000);
    toast("Touche encore ✕ pour renvoyer " + nice(name) + ".", false);
  }

  function viewEvents() {
    const m = head("Calendrier", "Événements et rendez-vous de la faction");
    const now = new Date();
    if (!S.month) S.month = new Date(now.getFullYear(), now.getMonth(), 1);
    if (!S.sel) S.sel = dayKey(now);
    const byDay = {};
    S.events.forEach((e) => { const k = dayKey(new Date(Number(e[1]) * 1000)); (byDay[k] = byDay[k] || []).push(e); });

    const h = el("div", "cal-head");
    const prev = el("button", "ib"); prev.type = "button"; prev.appendChild(use("i-left"));
    const next = el("button", "ib"); next.type = "button"; next.appendChild(use("i-right"));
    prev.addEventListener("click", () => { S.month = new Date(S.month.getFullYear(), S.month.getMonth() - 1, 1); viewEvents(); });
    next.addEventListener("click", () => { S.month = new Date(S.month.getFullYear(), S.month.getMonth() + 1, 1); viewEvents(); });
    h.appendChild(prev); h.appendChild(el("b", "", S.month.toLocaleDateString("fr-FR", { month: "long", year: "numeric" }))); h.appendChild(next);
    m.appendChild(h);

    const cal = el("div", "cal");
    ["Lun", "Mar", "Mer", "Jeu", "Ven", "Sam", "Dim"].forEach((d) => cal.appendChild(el("div", "dn", d)));
    const first = new Date(S.month);
    const start = new Date(first); start.setDate(1 - ((first.getDay() + 6) % 7));
    for (let i = 0; i < 42; i++) {
      const d = new Date(start); d.setDate(start.getDate() + i);
      if (i >= 35 && d.getMonth() !== S.month.getMonth()) break;
      const k = dayKey(d);
      const b = el("button", "day" + (d.getMonth() !== S.month.getMonth() ? " out" : "") + (k === dayKey(now) ? " today" : "") + (k === S.sel ? " sel" : "") + (byDay[k] ? " has" : ""), String(d.getDate()));
      b.type = "button";
      b.addEventListener("click", () => { S.sel = k; viewEvents(); });
      cal.appendChild(b);
    }
    m.appendChild(cal);

    const selDate = (() => { const p = S.sel.split("-").map(Number); return new Date(p[0], p[1], p[2]); })();
    const sec = el("div", "sec", selDate.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" }));
    sec.style.marginTop = "clamp(10px,3vh,18px)"; sec.style.textTransform = "capitalize";
    m.appendChild(sec);
    const list = byDay[S.sel] || [];
    if (!list.length) m.appendChild(el("p", "empty", "Aucun événement ce jour-là."));
    const mg = Number(S.me.mg) === 1;
    list.forEach((e) => {
      const d = new Date(Number(e[1]) * 1000);
      const r = el("div", "evrow");
      const dd = el("div", "evd"); dd.appendChild(el("b", "", String(d.getDate()))); dd.appendChild(el("small", "", d.toLocaleDateString("fr-FR", { month: "short" }))); r.appendChild(dd);
      const w = el("div", "who"); w.appendChild(el("b", "", e[2])); w.appendChild(el("small", "", d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }) + " · par " + nice(e[3]))); r.appendChild(w);
      if (mg) { const x = el("button", "ib del"); x.type = "button"; x.appendChild(use("i-x")); x.addEventListener("click", () => send("evdel", e[0])); r.appendChild(x); }
      m.appendChild(r);
    });

    if (mg) {
      const f = el("div", "form");
      const title = el("input"); title.placeholder = "Ex : Réunion de faction au QG"; title.maxLength = 46;
      const time = el("input"); time.type = "time"; time.value = "20:00";
      const add = el("button", "btn", "Ajouter"); add.type = "button";
      add.addEventListener("click", () => {
        const t = title.value.replace(/\s+/g, " ").trim();
        if (t.length < 3) { toast("Donne un titre à l'événement.", false); return; }
        const hm = (time.value || "20:00").split(":").map(Number);
        const when = new Date(selDate.getFullYear(), selDate.getMonth(), selDate.getDate(), hm[0] || 0, hm[1] || 0, 0);
        if (when.getTime() < Date.now() - 3600e3) { toast("Choisis une date à venir.", false); return; }
        send("evadd", Math.floor(when.getTime() / 1000) + " " + t);
        title.value = ""; title.blur();
      });
      f.appendChild(title); f.appendChild(time); f.appendChild(add);
      m.appendChild(f);
    }
  }

  function renderView() {
    renderFrame();
    if (S.view === "members") viewMembers();
    else if (S.view === "events") viewEvents();
    else viewDash();
  }

  function go(v) {
    if (v === S.view && v !== "dash") return;
    S.view = v; renderView();
    send("view", v);
  }

  /* ---------- coffre ---------- */
  function openSheet() {
    $("sheetBal").textContent = money(S.st.bal);
    $("wd").disabled = Number(S.me.mg) !== 1;
    $("sheetSub").textContent = "Ton liquide : " + money(S.me.cash) + ". Le retrait est réservé aux grades de gestion.";
    $("sheet").classList.remove("hidden");
  }
  function amount() { const v = Math.floor(Number($("sheetAmt").value) || 0); if (v < 1) { toast("Entre un montant.", false); return 0; } return v; }
  $("dep").addEventListener("click", () => { const v = amount(); if (v) { send("deposit", v); $("sheetAmt").value = ""; } });
  $("wd").addEventListener("click", () => { const v = amount(); if (v) { send("withdraw", v); $("sheetAmt").value = ""; } });
  $("sheetClose").addEventListener("click", () => $("sheet").classList.add("hidden"));
  $("sheet").addEventListener("click", (e) => { if (e.target === $("sheet")) $("sheet").classList.add("hidden"); });

  /* ---------- evenements de l'interface ---------- */
  document.querySelectorAll("#nav button").forEach((b) => b.addEventListener("click", () => go(b.dataset.view)));
  $("bell").addEventListener("click", () => go("events"));
  $("gear").addEventListener("click", () => send("refresh"));
  $("quit").addEventListener("click", () => { if (bridge && typeof bridge.close === "function") { try { bridge.close(); } catch (_) {} } });

  function apply(d) {
    if (d.fac) S.fac = d.fac;
    if (d.me) S.me = d.me;
    if (d.v === "dash") { if (d.st) S.st = d.st; if (Array.isArray(d.log)) S.log = d.log; if (Array.isArray(d.next)) S.next = d.next; }
    if (d.v === "members" && Array.isArray(d.list)) S.members = d.list;
    if (d.v === "events" && Array.isArray(d.list)) {
      S.events = d.list;
      const now = Date.now() / 1000 - 3600;
      S.next = d.list.filter((e) => Number(e[1]) >= now).slice(0, 4);
    }
    if (d.v && d.v !== S.view) S.view = d.v;
    renderView();
    if (!$("sheet").classList.contains("hidden")) openSheet();
    if (d.msg) toast(d.msg, Number(d.ok) === 1);
  }

  window.FacApp = {
    openFromNative(raw) { S.view = "dash"; S.q = ""; S.onlyOn = false; S.month = null; S.sel = null; apply(parse(raw)); },
    onUpdateFromNative(raw) { apply(parse(raw)); }
  };

  /* Apercu navigateur (hors jeu) */
  if (!bridge) {
    const now = Math.floor(Date.now() / 1000);
    window.FacApp.openFromNative({
      v: "dash", ok: 1, msg: "",
      fac: { id: 1, n: "Bataillon des operations speciales", s: "BOPE", t: "police", c: "2b5cff", rc: 8 },
      me: { n: "Tupac_Shakur", r: 3, rn: "2e Sergent", mg: 1, ld: 0, cash: 12500 },
      st: { m: 50, on: 4, bal: 0, ev: 2 },
      log: [[now - 300, "Marc Kone a rejoint la faction (Recrue)"], [now - 3600, "Tupac Shakur a depose 2000 $ au coffre"], [now - 7200, "Awa Diallo promu Caporal"]],
      next: [[1, now + 86400, "Entrainement au stand de tir", "Chef_Bope"], [2, now + 3 * 86400, "Patrouille Grove Street", "Tupac_Shakur"]]
    });
  }
  try { if (bridge && typeof bridge.ready === "function") bridge.ready(); } catch (_) {}
})();
</script>
</body>
</html>
