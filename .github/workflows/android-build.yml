name: Android Build

on:
  push:
    branches: [ "main", "v22", "v23-conduite-matin" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Le SDK Android est déjà préinstallé sur ubuntu-latest (ANDROID_HOME).
      # L'action android-actions/setup-android échoue ("Failed to find package 'tools'")
      # avec les cmdline-tools récents, donc on utilise le sdkmanager du runner.
      - name: Install NDK + CMake + platform
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;26.2.11394342" "cmake;3.22.1" "platforms;android-36"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crestwood-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publier l'APK dans la release V23-conduite-matin
        if: github.ref == 'refs/heads/v23-conduite-matin'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/*.apk CrestwoodRP-V23-conduite-matin.apk
          gh release delete V23-conduite-matin -y --cleanup-tag -R ${{ github.repository }} || true
          gh release create V23-conduite-matin CrestwoodRP-V23-conduite-matin.apk -R ${{ github.repository }} --target v23-conduite-matin --prerelease --title "APK V22 corrige" --notes "V23 + boutons de conduite (accelerateur, frein, klaxon, frein a main)"
