<!DOCTYPE html>
<html lang="fr" data-color>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Garage auto</title>
<!--
  [v30c] Reparation auto (autorepair du MTA). Serveur : include/Pages.inc (Rpr_*).
  JSON : {veh, hp, price, time, mech, block, cash, state:"idle|work|busy", left, pct, near}
  Actions : SampPage.action("start") / action("refresh")
-->
<link rel="stylesheet" href="../common/cw-page.css">
<style>
:root { --a1: #ff8a1f; --a2: #ffc147; }
.panel { width: min(92vw, 600px); height: min(88vh, 340px); }
.body { align-items: stretch; }
.car { width: 46%; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 8px; padding: 6px;
  border-radius: 16px; background: radial-gradient(circle at 50% 40%, rgba(255, 160, 50, .16), transparent 70%), var(--glass2); border: 1px solid var(--line); position: relative; overflow: hidden; }
.gear { width: 92px; height: 92px; position: relative; }
.gear svg { width: 100%; height: 100%; }
.gear .g1 { transform-origin: 50% 50%; animation: spin 6s linear infinite; }
.work .gear .g1 { animation-duration: 1.4s; }
@keyframes spin { to { transform: rotate(360deg); } }
.ring { position: absolute; inset: 0; }
.ring circle { fill: none; stroke-width: 6; }
.ring .bg { stroke: rgba(255, 255, 255, .07); }
.ring .fg { stroke: url(#rg); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .9s linear; }
.vname { font-size: 14px; font-weight: 900; text-align: center; }
.state { font-size: 10.5px; font-weight: 700; color: var(--soft); text-align: center; min-height: 14px; }
.work .state { color: #ffd58a; }
.done .state { color: #7af0aa; }
.info { flex: 1; display: flex; flex-direction: column; gap: 8px; justify-content: center; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 12px; border-radius: 12px; background: var(--glass2); border: 1px solid var(--line); font-size: 11.5px; animation: pgUp .3s ease both; }
.row span { color: var(--soft); } .row b { font-weight: 900; }
.hp { flex: 1; height: 7px; margin: 0 10px; border-radius: 9px; background: rgba(255, 255, 255, .08); overflow: hidden; }
.hp i { display: block; height: 100%; width: 0; border-radius: 9px; background: linear-gradient(90deg, #ff4d63, #ffbf47, #37d67a); background-size: 300% 100%; transition: width .5s, background-position .5s; }
.warn { display: none; padding: 8px 12px; border-radius: 12px; font-size: 10.5px; line-height: 1.4; color: #ffd58a; background: rgba(255, 191, 71, .1); border: 1px solid rgba(255, 191, 71, .3); }
.warn.show { display: block; animation: pgUp .3s ease both; }
.spark { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #ffd27a; opacity: 0; }
.work .spark { animation: spark 1.1s ease-out infinite; }
@keyframes spark { 0% { opacity: 1; transform: translate(0, 0); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)); } }
</style>
</head>
<body>
<div class="ov">
  <div class="panel">
    <div class="top">
      <div class="logo"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg></div>
      <div class="ttl"><b>Garage auto</b><small>Idlewood · réparation express</small></div>
      <button class="x" aria-label="Fermer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="body">
      <div class="car" id="car">
        <div class="gear">
          <svg class="ring" viewBox="0 0 100 100"><defs><linearGradient id="rg" x1="0" x2="1"><stop offset="0" stop-color="#ff8a1f"/><stop offset="1" stop-color="#ffd25c"/></linearGradient></defs>
            <circle class="bg" cx="50" cy="50" r="45"/><circle class="fg" id="ring" cx="50" cy="50" r="45" stroke-dasharray="282.7" stroke-dashoffset="282.7"/></svg>
          <svg viewBox="0 0 100 100" style="position:absolute;inset:0"><g class="g1"><g fill="#ffb347"><rect x="45" y="20" width="10" height="13" rx="2" transform="rotate(0 50 50)"/><rect x="45" y="20" width="10" height="13" rx="2" transform="rotate(45 50 50)"/><rect x="45" y="20" width="10" height="13" rx="2" transform="rotate(90 50 50)"/><rect x="45" y="20" width="10" height="13" rx="2" transform="rotate(135 50 50)"/><rect x="45" y="20" width="10" height="13" rx="2" transform="rotate(180 50 50)"/><rect x="45" y="20" width="10" height="13" rx="2" transform="rotate(225 50 50)"/><rect x="45" y="20" width="10" height="13" rx="2" transform="rotate(270 50 50)"/><rect x="45" y="20" width="10" height="13" rx="2" transform="rotate(315 50 50)"/><circle cx="50" cy="50" r="20"/></g><circle cx="50" cy="50" r="8" fill="#1a1f2b"/></g></svg>
          <i class="spark" style="left:50%;top:50%;--dx:-34px;--dy:-22px"></i><i class="spark" style="left:50%;top:50%;--dx:30px;--dy:-26px;animation-delay:.3s"></i><i class="spark" style="left:50%;top:50%;--dx:24px;--dy:28px;animation-delay:.6s"></i>
        </div>
        <div class="vname" id="veh">—</div>
        <div class="state" id="state"></div>
      </div>
      <div class="info">
        <div class="row"><span>État</span><div class="hp"><i id="hpBar"></i></div><b id="hp">—</b></div>
        <div class="row" style="animation-delay:.05s"><span>Prix</span><b class="money" id="price">2 500 $</b></div>
        <div class="row" style="animation-delay:.1s"><span>Durée</span><b id="time">24 s</b></div>
        <div class="row" style="animation-delay:.15s"><span>Sur toi</span><b id="cash">—</b></div>
        <div class="warn" id="warn"></div>
      </div>
    </div>
    <div class="foot">
      <div class="sum" id="sum">Reste au volant : le véhicule est bloqué pendant la réparation.</div>
      <button class="btn" id="go" disabled>Réparer</button>
    </div>
  </div>
</div>
<script src="../common/cw-page.js"></script>
<script>
(function () {
  "use strict";
  var Cw = window.CwPage, $ = Cw.$, last = {};
  function render(d) {
    last = d;
    var hp = Math.max(0, Math.min(1000, d.hp || 0)), pct = Math.round(hp / 10);
    var onFoot = d.veh === "A pied";
    $("veh").textContent = onFoot ? "Aucun véhicule" : d.veh;
    $("hp").textContent = onFoot ? "—" : pct + " %";
    $("hpBar").style.width = (onFoot ? 0 : pct) + "%";
    $("hpBar").style.backgroundPosition = (100 - pct) + "% 0";
    $("price").textContent = Cw.money(d.price || 2500);
    $("time").textContent = (d.time || 24) + " s";
    $("cash").textContent = Cw.money(d.cash || 0);
    $("cash").className = (d.cash || 0) >= (d.price || 2500) ? "money" : "";
    var car = $("car"), ring = $("ring"), go = $("go"), state = $("state"), warn = $("warn");
    car.className = "car" + (d.state === "work" ? " work" : "") + (d.ok === 1 && d.state === "idle" && pct >= 99 ? " done" : "");
    var p = d.state === "work" ? (d.pct || 0) : (d.ok === 1 && d.state === "idle" && pct >= 99 ? 100 : 0);
    ring.style.strokeDashoffset = String(282.7 * (1 - p / 100));
    warn.className = "warn";
    if (d.state === "work") { state.textContent = "Réparation… " + (d.left || 0) + " s"; go.disabled = true; go.textContent = p + " %"; }
    else if (d.state === "busy") { state.textContent = "Garage occupé"; go.disabled = true; go.textContent = "Occupé"; }
    else {
      state.textContent = onFoot ? "Entre avec ton véhicule" : (pct >= 99 ? "En parfait état" : "Prêt à réparer");
      go.textContent = "Réparer · " + Cw.money(d.price || 2500);
      go.disabled = onFoot || !d.near || pct >= 100 || (d.cash || 0) < (d.price || 2500) || (d.block && d.mech > 0);
      if (d.block && d.mech > 0) { warn.textContent = d.mech + " mécanicien" + (d.mech > 1 ? "s sont" : " est") + " en ville : appelle-les pour une réparation RP."; warn.className = "warn show"; }
      else if (!d.near && !onFoot) { warn.textContent = "Gare-toi dans le garage pour lancer la réparation."; warn.className = "warn show"; }
    }
  }
  $("go").addEventListener("click", function () { $("go").disabled = true; Cw.send("start", ""); });
  Cw.boot(function (d) { render(d); });

  if (!window.SampPage && /[?&]demo/.test(location.search)) {
    var w = location.search.indexOf("work") > 0;
    PageApp.openFromNative(JSON.stringify({ veh: "Sultan", hp: 540, price: 2500, time: 24, mech: 0, block: 1, cash: 8450, state: w ? "work" : "idle", left: 9, pct: 62, near: 1 }));
  }
})();
</script>
</body>
</html>
