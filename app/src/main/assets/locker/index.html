<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="Vestiaire de faction de Crestwood Roleplay : tenues et équipement.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vestiaire</title>
  <link rel="stylesheet" href="locker.css">
  <link rel="stylesheet" href="../common/cw-perf.css">
</head>
<body>
<!-- [v56] Vestiaire : petit menu a gauche facon GTA V, le jeu reste visible (le personnage se change en direct).
     Serveur -> page : LockerApp.openFromNative(json) / LockerApp.onUpdateFromNative(json)
     Page -> serveur : SampLocker.action(type, {"arg":".."}) -> /lockeract (SAMP.java), SampLocker.close() -->
<main class="lk" id="lk">
  <header class="lk-head">
    <div><b>Vestiaire</b><small id="lkFac">Faction</small></div>
    <button class="lk-x" id="lkClose" type="button" aria-label="Fermer"></button>
  </header>
  <div class="lk-sub"><span id="lkRank"></span><span id="lkState">Tenue civile</span></div>
  <nav class="lk-list" id="lkList"></nav>
  <p class="lk-desc" id="lkDesc"></p>
</main>
<div class="lk-toast" id="lkToast" hidden></div>
<script src="locker.js"></script>
</body>
</html>
