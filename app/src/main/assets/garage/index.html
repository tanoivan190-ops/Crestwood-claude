<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Garage</title>
<!--
  [v15b] Garage Crestwood (style "garage RP" bleu transparent) : /garage partout ou roue du HUD.
  Serveur -> page : GarageApp.openFromNative(json) / GarageApp.onUpdateFromNative(json)   ("@garage" 9750-9752)
  Page -> serveur : SampGarage.action(type, {"arg":"<id>"}) -> /garact take|store|sell|gps <id>
  JSON : {"garage":"Garage Central","at":1,"deliv":500,"cash":5000,"bank":0,"maxOut":2,"msg":"","ok":1,
          "veh":[{"id":12,"m":411,"n":"Infernus","plate":"CW-0012","hp":100,"fuel":100,"out":0,"sell":57000}]}
-->
<link rel="stylesheet" href="garage.css">
  <link rel="stylesheet" href="../common/cw-pro.css">
  <link rel="stylesheet" href="../common/cw-perf.css">
</head>
<body>
<main class="app" id="app" hidden>
  <aside class="side">
    <div class="preview" id="preview">
      <svg class="big" viewBox="0 0 64 32" aria-hidden="true"><use id="bigUse" href="#sil-car"/></svg>
      <span class="state" id="selState">—</span>
    </div>
    <div class="info">
      <div class="title-row"><h2 id="selName">Aucun véhicule</h2><span class="plate" id="selPlate"></span></div>
      <div class="meter"><div class="meter-head"><span>Carburant</span><b id="fuelTxt">—</b></div><i><s id="fuelBar"></s></i></div>
      <div class="meter"><div class="meter-head"><span>Coffre</span><b id="trunkTxt">—</b></div><i><s id="trunkBar"></s></i></div>
      <div class="meter"><div class="meter-head"><span>État</span><b id="hpTxt">—</b></div><i class="hp"><s id="hpBar"></s></i></div>
    </div>
    <p class="hint" id="hint">Sélectionne le véhicule souhaité et utilise les options ci-dessous pour réaliser l'action.</p>
    <div class="actions">
      <button class="act" type="button" data-act="take" id="btnTake">Sortir le véhicule</button>
      <button class="act" type="button" data-act="store" id="btnStore">Ranger le véhicule</button>
      <button class="act" type="button" data-act="gps" id="btnGps">Localiser (GPS)</button>
      <button class="act danger" type="button" data-act="sell" id="btnSell">Vendre le véhicule</button>
    </div>
  </aside>

  <section class="main">
    <header class="top">
      <div class="where"><small id="garKind">Garage</small><b id="garName">Mes véhicules</b></div>
      <div class="money"><span>Liquide <b id="cash">0</b></span><span>Banque <b id="bank">0</b></span></div>
      <button class="close" id="close" type="button" aria-label="Fermer">✕</button>
    </header>
    <nav class="tabs" id="tabs">
      <button class="tab on" type="button" data-cat="all">Tous</button>
      <button class="tab" type="button" data-cat="car">Voitures</button>
      <button class="tab" type="button" data-cat="bike">Motos</button>
      <button class="tab" type="button" data-cat="boat">Bateaux</button>
      <button class="tab" type="button" data-cat="truck">Camions</button>
      <button class="tab" type="button" data-cat="air">Avions</button>
    </nav>
    <div class="grid" id="grid"></div>
  </section>

  <div class="confirm" id="confirm" hidden>
    <div class="cf-card">
      <h3 id="cfTitle"></h3>
      <p id="cfText"></p>
      <div class="cf-row"><button class="act" type="button" id="cfNo">Annuler</button><button class="act sel" type="button" id="cfYes">Confirmer</button></div>
    </div>
  </div>
  <div class="toast" id="toast" hidden></div>
</main>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="sil-car" viewBox="0 0 64 32"><path d="M4 22.5c0-2.4 1.6-4.3 3.9-4.8l6.2-1.3 7.4-6.2c1.6-1.3 3.6-2 5.7-2h11.4c2.2 0 4.3.8 5.9 2.3l5.4 5.1 6 1c2.4.4 4.1 2.5 4.1 4.9v2.6c0 1.1-.9 2-2 2h-3.1a6.1 6.1 0 0 0-12 0H20.6a6.1 6.1 0 0 0-12 0H6c-1.1 0-2-.9-2-2zM14.6 30a4.6 4.6 0 1 1 0-9.2 4.6 4.6 0 0 1 0 9.2zm34.8 0a4.6 4.6 0 1 1 0-9.2 4.6 4.6 0 0 1 0 9.2z"/></symbol>
    <symbol id="sil-bike" viewBox="0 0 64 32"><path d="M12 31a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm0-4.2a3.8 3.8 0 1 0 0-7.6 3.8 3.8 0 0 0 0 7.6zM52 31a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm0-4.2a3.8 3.8 0 1 0 0-7.6 3.8 3.8 0 0 0 0 7.6z"/><path d="M11 23.5 22 13h8.5l4-4.5h7l-2.2 3.2 6.4 1.6L52 23l-3.2 1.6-4.2-6.8-4.5 6.7H28.4l-6.3-6.4-8.7 7.4zM35 7h7.5l1.6-2.8h3.8l-1 2.8 3.4.4-.4 2H41z"/></symbol>
    <symbol id="sil-boat" viewBox="0 0 64 32"><path d="M2 19.5h60l-6.5 9.3a3 3 0 0 1-2.5 1.2H12a3 3 0 0 1-2.7-1.6zM18 18.5l5.5-7.5h15.4l7.6 7.5zM28 10l2-5h7l-1.5 5z"/></symbol>
    <symbol id="sil-truck" viewBox="0 0 64 32"><path d="M2 5.5c0-1.1.9-2 2-2h33c1.1 0 2 .9 2 2v17H2zM40.5 9H51c1.4 0 2.7.7 3.4 1.9l5 8c.4.6.6 1.4.6 2.1v4c0 1.1-.9 2-2 2h-2.6a6 6 0 0 0-11.8 0H40.5zM45 11v6.5h10.4l-3.6-5.6c-.4-.6-1-.9-1.7-.9zM2 24h11.3a6 6 0 0 0 0 3H4a2 2 0 0 1-2-2zM15 31a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9zm34.4 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9zM19.5 24h18.2v3H20a6 6 0 0 0-.5-3z"/></symbol>
    <symbol id="sil-air" viewBox="0 0 64 32"><path d="M2 15.5c0-1.2 1-2.2 2.2-2.2h20.3L36 3.5h5.5l-5.6 9.8H52l5-5.3h4.2l-2.7 7.6 2.7 7.6H57l-5-5.3H35.9l5.6 9.8H36L24.5 17.9H4.2c-1.2 0-2.2-1-2.2-2.2z"/></symbol>
  </defs>
</svg>
<script src="garage.js"></script>
</body>
</html>
