<!DOCTYPE html>
<html lang="fr" data-th="grey">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gouvernement de San Andreas</title>
<!--
  Panneau du gouvernement EN JEU, au style des panneaux de faction (barre laterale, cartes, profil a droite).
  Ouvert depuis le menu d'interaction (appui long 5 s sur un joueur > Gouv. > Dossier citoyen) ou /gouvpanel.
  Serveur -> page : GovApp.openFromNative(json) / GovApp.onUpdateFromNative(json)   (dialogues "@gov" 9660-9662)
    {"me":{"n":"Nom","rank":3,"rn":"Ministre","tax":5,"tr":120000,"cTax":1,"cSub":1},
     "cit":{"id":3,"n":"John Doe","age":24,"or":"Abidjan","num":482913,"hasId":1,"lic":[1,0,2,0],"wl":0,"wr":"",
            "rec":[["c","Vol",1700000000,"Officier_X"]]},
     "ok":1,"msg":""}
  Page -> serveur : SampGov.action(type, {"arg":"..."}) -> /govact <type> <arg>   (SAMP.java, liste blanche)
     licgive N | lictake N | subsidy MONTANT | tax POURCENT | announce TEXTE | refresh
-->
<style>
:root{
  --frame:#33353e; --side:#2a2c34; --main:#363841; --card:#474953; --card2:#4f515b; --right1:#5a5c66; --right2:#45474f;
  --line:rgba(255,255,255,.07); --text:#f4f5f8; --soft:#c9ccd6; --muted:#9a9eab;
  --blue:#8b8b8b; --green:#3ad070; --cyan:#a6a6a6; --amber:#ffb84d; --red:#ff5a6a; --gold:#e8c06a;
  --r-xl:4px; --r-lg:4px; --r-md:4px;
  --font:"Poppins","Montserrat","Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:transparent;font-family:var(--font);color:var(--text);-webkit-user-select:none;user-select:none}
button,input,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.hidden{display:none!important}
svg{display:block}

.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:2.2vh 2.4vw;background:radial-gradient(ellipse at 50% 50%,rgba(6,8,14,.35),rgba(6,8,14,0.56));animation:fade .2s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.frame{width:min(97vw,1060px);height:min(94vh,620px);padding:clamp(6px,1.6vh,12px);border-radius:4px;
  background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03));box-shadow:0 30px 80px rgba(0,0,0,.55);animation:pop .24s cubic-bezier(.2,.9,.3,1.15)}
@keyframes pop{from{transform:translateY(12px) scale(.97);opacity:.4}to{transform:none;opacity:1}}
.panel{height:100%;display:grid;grid-template-columns:clamp(128px,19%,200px) minmax(0,1fr) clamp(150px,23%,250px);border-radius:var(--r-xl);overflow:hidden;background:var(--frame)}

/* barre laterale */
.side{display:flex;flex-direction:column;align-items:center;min-height:0;padding:clamp(10px,3vh,26px) 10px clamp(8px,2.4vh,20px);background:var(--side)}
.logo{position:relative;flex:none;width:clamp(50px,17vh,104px);height:clamp(50px,17vh,104px);border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 30%,#5a4720,rgba(13,11,6,0.62) 72%);box-shadow:0 0 0 3px rgba(232,192,106,.25),0 10px 28px rgba(0,0,0,.45),inset 0 -10px 24px rgba(0,0,0,.4)}
.logo svg{width:52%;height:52%}
.fname{margin:clamp(6px,2vh,16px) 0 clamp(6px,2.6vh,24px);font-size:clamp(11px,3.2vh,17px);font-weight:800;letter-spacing:.06em;text-transform:uppercase;text-align:center}
.nav{width:100%;display:flex;flex-direction:column;gap:clamp(2px,1vh,8px)}
.nav button{display:flex;align-items:center;gap:clamp(8px,1.6vw,14px);width:100%;padding:clamp(6px,1.8vh,13px) clamp(8px,1.4vw,16px);border-radius:4px;
  font-size:clamp(10.5px,2.9vh,14px);font-weight:700;color:var(--soft)}
.nav button svg{width:clamp(16px,4.6vh,24px);height:clamp(16px,4.6vh,24px);flex:none}
.nav button.on{color:var(--blue)}
.nav button:active{background:rgba(255,255,255,.05)}
.quit{margin-top:auto;display:flex;align-items:center;gap:12px;padding:clamp(5px,1.6vh,10px) 14px;border-radius:4px;font-size:clamp(10.5px,2.9vh,14px);font-weight:700;color:var(--soft)}
.quit svg{width:clamp(16px,4.6vh,24px);height:clamp(16px,4.6vh,24px)}
.quit:active{background:rgba(255,90,106,.15);color:#fff}

/* zone centrale */
.main{min-width:0;min-height:0;padding:clamp(6px,1.8vh,12px) 0;display:flex}
.main-in{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;margin:0 clamp(6px,1vw,10px);padding:clamp(12px,3.4vh,24px) clamp(12px,2vw,24px);border-radius:var(--r-lg);background:var(--main);
  overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.main-in::-webkit-scrollbar{display:none}
.main-in > *{flex-shrink:0}
.h1{font-size:clamp(15px,4.6vh,24px);font-weight:800;line-height:1.1}
.sub{margin-top:2px;font-size:clamp(9.5px,2.5vh,12.5px);color:var(--soft);font-weight:500}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:clamp(7px,2vh,14px);margin:clamp(10px,3vh,20px) 0 clamp(12px,3.4vh,22px)}
.card{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:clamp(50px,14vh,80px);padding:clamp(9px,2.4vh,16px) clamp(12px,1.8vw,20px) clamp(9px,2.4vh,16px) clamp(16px,2.2vw,24px);
  border-radius:var(--r-md);background:linear-gradient(180deg,var(--card2),var(--card));box-shadow:0 8px 20px rgba(0,0,0,.18);overflow:hidden;text-align:left}
.card::before{content:"";position:absolute;left:0;top:16%;bottom:16%;width:3px;border-radius:0 3px 3px 0;background:var(--c,var(--blue))}
.card b{display:block;font-size:clamp(11.5px,3.3vh,16px);font-weight:800}
.card small{display:block;margin-top:2px;font-size:clamp(9.5px,2.6vh,13px);color:var(--soft);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ic{flex:none;color:var(--c,var(--blue))}
.card .ic svg{width:clamp(18px,5.6vh,30px);height:clamp(18px,5.6vh,30px)}
.sec{display:flex;align-items:center;justify-content:space-between;font-size:clamp(12px,3.6vh,17px);font-weight:800;margin-bottom:clamp(6px,1.8vh,12px)}
.sec small{font-size:clamp(8.5px,2.2vh,11px);font-weight:600;color:var(--muted)}
.box{border-radius:var(--r-md);background:rgba(255,255,255,.035);padding:clamp(4px,1.2vh,8px) clamp(10px,1.4vw,14px);margin-bottom:clamp(12px,3.4vh,22px)}
.lic{display:flex;align-items:center;gap:10px;padding:clamp(6px,1.8vh,10px) 0;border-bottom:1px solid var(--line)}
.lic:last-child{border-bottom:0}
.lic .nm{flex:1;min-width:0;font-size:clamp(10px,2.7vh,13px);font-weight:600}
.pill{flex:none;padding:3px 9px;border-radius:3px;font-size:clamp(8px,2.1vh,10.5px);font-weight:800}
.pill.ok{background:rgba(58,208,112,.18);color:#8ff0b3}
.pill.no{background:rgba(255,255,255,.07);color:var(--muted)}
.pill.bad{background:rgba(255,90,106,.18);color:#ffb2ba}
.btn{padding:clamp(5px,1.6vh,9px) 14px;border-radius:4px;font-size:clamp(9.5px,2.6vh,12.5px);font-weight:800;background:var(--blue);color:#fff;box-shadow:0 6px 16px rgba(139,139,139,0.3);white-space:nowrap}
.btn.red{background:rgba(255,90,106,.16);color:#ffb2ba;box-shadow:none}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.35}
.row{display:flex;gap:8px;align-items:center}
.row input{flex:1;min-width:0}
input,textarea{width:100%;padding:clamp(6px,1.8vh,10px) 12px;border-radius:4px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:clamp(10px,2.7vh,13px);outline:none;-webkit-user-select:text;user-select:text}
input:focus,textarea:focus{border-color:var(--blue)}
textarea{resize:none;height:clamp(48px,14vh,80px)}
.help{font-size:clamp(8.5px,2.2vh,11px);color:var(--muted);margin-top:6px;line-height:1.35}
.rec{display:flex;align-items:center;gap:10px;padding:clamp(6px,1.7vh,10px) 0;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:0}
.rec .tg{flex:none;padding:3px 8px;border-radius:4px;font-size:clamp(7.5px,2vh,9.5px);font-weight:800;text-transform:uppercase;background:rgba(255,255,255,.07);color:var(--soft)}
.rec .tg.c,.rec .tg.a,.rec .tg.w{background:rgba(255,90,106,.18);color:#ffb2ba}
.rec .tg.f,.rec .tg.s{background:rgba(255,184,77,.18);color:#ffd59a}
.rec .t{flex:1;min-width:0}
.rec .t b{display:block;font-size:clamp(9.5px,2.6vh,12.5px);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .t small{font-size:clamp(8px,2.1vh,10.5px);color:var(--muted)}
.empty{padding:clamp(8px,3vh,20px) 0;text-align:center;font-size:clamp(9.5px,2.6vh,12.5px);color:var(--muted)}
.wanted{display:flex;align-items:center;gap:10px;margin-bottom:clamp(10px,3vh,18px);padding:clamp(7px,2vh,11px) 14px;border-radius:var(--r-md);background:rgba(255,90,106,.14);color:#ffc9cf;font-size:clamp(9.5px,2.6vh,12.5px);font-weight:700}
.wanted b{color:var(--red);letter-spacing:.1em}
.step{display:flex;align-items:center;border-radius:4px;overflow:hidden;background:rgba(255,255,255,.05)}
.step button{width:clamp(28px,7.6vh,38px);height:clamp(28px,7.6vh,38px);font-size:18px;font-weight:800}
.step button:active{background:rgba(255,255,255,.1)}
.step b{min-width:clamp(44px,12vh,62px);text-align:center;font-size:clamp(12px,3.4vh,16px)}
.none{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;color:var(--soft);font-size:clamp(10px,2.7vh,13px);padding:3vh 0}
.none svg{width:clamp(36px,11vh,56px);height:clamp(36px,11vh,56px);color:var(--gold);opacity:.8}

/* colonne de droite */
.right{position:relative;display:flex;flex-direction:column;align-items:center;padding:clamp(14px,4.6vh,32px) clamp(10px,1.6vw,18px) clamp(10px,3vh,20px);background:linear-gradient(180deg,var(--right1),var(--right2));min-height:0}
.gear{position:absolute;top:clamp(10px,3vh,18px);right:clamp(10px,1.6vw,18px);color:rgba(255,255,255,.75)}
.gear svg{width:clamp(16px,4.6vh,24px);height:clamp(16px,4.6vh,24px)}
.me-av{width:clamp(64px,22vh,124px);height:clamp(64px,22vh,124px);border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#ffffff,#dfe1e6);
  color:#3a3d47;font-size:clamp(20px,7vh,40px);font-weight:800;box-shadow:0 12px 30px rgba(0,0,0,.3),0 0 0 5px rgba(255,255,255,.08)}
.me-n{margin-top:clamp(8px,2.6vh,16px);font-size:clamp(13px,4vh,20px);font-weight:800;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-r{margin-top:2px;font-size:clamp(9.5px,2.7vh,13px);color:rgba(255,255,255,.72);font-weight:600;text-align:center}
.kv{width:100%;margin-top:clamp(12px,3.6vh,24px);display:flex;flex-direction:column;gap:8px}
.kv div{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:clamp(6px,1.8vh,10px) 12px;border-radius:4px;background:rgba(20,22,28,.28);font-size:clamp(9px,2.4vh,11.5px)}
.kv span{color:rgba(255,255,255,.72)}
.kv b{font-weight:800;white-space:nowrap}
.cit-mini{width:100%;margin-top:auto;padding:clamp(7px,2vh,12px);border-radius:4px;background:rgba(20,22,28,.35);text-align:center}
.cit-mini small{display:block;font-size:clamp(8px,2vh,10px);color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.cit-mini b{display:block;margin-top:2px;font-size:clamp(10.5px,2.9vh,14px);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.toast{position:fixed;left:50%;bottom:4vh;transform:translateX(-50%);max-width:80vw;padding:clamp(7px,2vh,11px) 18px;border-radius:4px;font-size:clamp(10px,2.7vh,13px);font-weight:700;
  background:rgba(22,60,38,0.62);color:#bff5d2;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:9;animation:fade .15s}
.toast.err{background:rgba(70,20,26,0.62);color:#ffc9cf}
@media (max-width:620px){ .panel{grid-template-columns:clamp(110px,24%,150px) minmax(0,1fr)} .right{display:none} }
</style>
<link rel="stylesheet" href="../common/crestwood-theme.css" />
  <link rel="stylesheet" href="../common/cw-pro.css">
  <link rel="stylesheet" href="../common/cw-perf.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-user" viewBox="0 0 24 24"><path fill="currentColor" d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm-9 10c0-5 4-8 9-8s9 3 9 8H3Z"/></symbol>
    <symbol id="i-bank" viewBox="0 0 24 24"><path fill="currentColor" d="m12 2 10 5v2H2V7l10-5ZM4 10h3v8H4v-8Zm6.5 0h3v8h-3v-8ZM17 10h3v8h-3v-8ZM2 19h20v3H2v-3Z"/></symbol>
    <symbol id="i-out" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M14 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8M10 12h11M17 8l4 4-4 4"/></symbol>
    <symbol id="i-id" viewBox="0 0 24 24"><path fill="currentColor" d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm5 9a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Zm-4 3h8c0-1.7-1.8-3-4-3s-4 1.3-4 3Zm10-7v2h6v-2h-6Zm0 4v2h4v-2h-4Z"/></symbol>
    <symbol id="i-badge" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a5 5 0 0 1 3.5 8.6L17 22l-5-3-5 3 1.5-11.4A5 5 0 0 1 12 2Z"/></symbol>
    <symbol id="i-scale" viewBox="0 0 24 24"><path fill="currentColor" d="M11 3h2v3h6l-3 7a3 3 0 0 0 6 0l-3-7h1V4h-7V3h-2v1H4v2h1l-3 7a3 3 0 0 0 6 0L5 6h6v13H7v2h10v-2h-4V6Z"/></symbol>
    <symbol id="i-money" viewBox="0 0 24 24"><path fill="currentColor" d="M3 6h18a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1Zm9 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM5 9v6h1V9H5Zm13 0v6h1V9h-1Z"/></symbol>
    <symbol id="i-pct" viewBox="0 0 24 24"><path fill="currentColor" d="M7 4a3 3 0 1 1 0 6 3 3 0 0 1 0-6Zm10 10a3 3 0 1 1 0 6 3 3 0 0 1 0-6ZM18.4 4 20 5.6 5.6 20 4 18.4 18.4 4Z"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></symbol>
  </defs>
</svg>

<main class="ov">
  <div class="frame"><div class="panel">
    <aside class="side">
      <div class="logo"><svg viewBox="0 0 64 64"><path d="M32 3l24 8v18c0 16-10 27-24 32C18 56 8 45 8 29V11l24-8z" fill="#e8c06a"/><path d="M32 9l18 6v14c0 12-7 21-18 25C21 50 14 41 14 29V15l18-6z" fill="#0d0b06"/><path d="M32 20l3.6 7.3 8 1.2-5.8 5.6 1.4 8L32 38.4l-7.2 3.7 1.4-8-5.8-5.6 8-1.2L32 20z" fill="#f3d98f"/></svg></div>
      <div class="fname">Gouvernement</div>
      <nav class="nav" id="nav">
        <button type="button" data-view="cit" class="on"><svg><use href="#i-user"/></svg>Citoyen</button>
        <button type="button" data-view="state"><svg><use href="#i-bank"/></svg>État</button>
      </nav>
      <button type="button" class="quit" id="quit"><svg><use href="#i-out"/></svg>Fermer</button>
    </aside>

    <section class="main"><div class="main-in" id="mainIn"></div></section>

    <aside class="right">
      <button type="button" class="gear" id="gear" aria-label="Actualiser"><svg><use href="#i-gear"/></svg></button>
      <div class="me-av" id="meAv">?</div>
      <div class="me-n" id="meN">—</div>
      <div class="me-r" id="meR">—</div>
      <div class="kv">
        <div><span>Caisse</span><b id="kTr">—</b></div>
        <div><span>TVA</span><b id="kTax">—</b></div>
      </div>
      <div class="cit-mini"><small>Citoyen</small><b id="citMiniN">Aucun</b></div>
    </aside>
  </div></div>
</main>
<div class="toast hidden" id="toast" role="status"></div>

<script>
(function () {
  "use strict";
  const bridge = window.SampGov || null;
  const $ = (id) => document.getElementById(id);
  const LIC = ["Permis de conduire", "Permis port d'armes", "Permis poids lourds", "Permis navire"];
  const REC = { c: "Inculpation", f: "Amende", a: "Arrestation", l: "Permis", w: "Recherche", s: "Saisie" };
  const WANT = ["", "Surveillance", "Recherche", "Recherche active", "Dangereux", "Très dangereux", "Ennemi public"];
  const S = { view: "cit", me: {}, cit: null, tax: 5, busy: false };

  function parse(raw) { if (raw && typeof raw === "object") return raw; try { return JSON.parse(raw || "{}") || {}; } catch (_) { return {}; } }
  function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; }
  function use(id) { const ns = "http://www.w3.org/2000/svg"; const s = document.createElementNS(ns, "svg"); const u = document.createElementNS(ns, "use"); u.setAttribute("href", "#" + id); s.appendChild(u); return s; }
  function nice(s) { return String(s || "").replace(/_/g, " "); }
  function money(n) { return (Number(n) || 0).toLocaleString("fr-FR").replace(/[  ]/g, " ") + " FCFA"; }
  function dateFr(ts) { const d = new Date((Number(ts) || 0) * 1000); return Number(ts) && !isNaN(d) ? d.toLocaleDateString("fr-FR") : "—"; }
  function initials(n) { return nice(n).split(" ").filter(Boolean).slice(0, 2).map((w) => w[0]).join("").toUpperCase() || "?"; }
  function send(type, arg) {
    const payload = JSON.stringify({ arg: arg == null ? "" : String(arg) });
    if (bridge && typeof bridge.action === "function") { try { bridge.action(type, payload); } catch (_) {} }
    else console.log("[gov] action", type, payload);
  }
  let tt = 0;
  function toast(msg, ok) {
    if (!msg) return;
    const t = $("toast"); t.textContent = msg; t.classList.toggle("err", !ok); t.classList.remove("hidden");
    clearTimeout(tt); tt = setTimeout(() => t.classList.add("hidden"), 3200);
  }
  function card(title, sub, color, icon) {
    const c = el("div", "card"); c.style.setProperty("--c", color);
    const t = el("div"); t.appendChild(el("b", "", title)); t.appendChild(el("small", "", sub)); c.appendChild(t);
    const ic = el("span", "ic"); ic.appendChild(use(icon)); c.appendChild(ic);
    return c;
  }
  function head(title, sub) {
    const m = $("mainIn"); m.replaceChildren();
    m.appendChild(el("div", "h1", title)); m.appendChild(el("div", "sub", sub));
    return m;
  }

  /* ---------- citoyen ---------- */
  function viewCitizen() {
    const c = S.cit;
    if (!c) {
      const m = head("Dossier citoyen", "Papiers, permis, casier et aides de l'État");
      const n = el("div", "none"); n.appendChild(use("i-user"));
      n.appendChild(el("b", "", "Aucun citoyen sélectionné"));
      n.appendChild(el("span", "", "Maintiens ton doigt 5 secondes sur un joueur, onglet Gouv., puis « Dossier citoyen »."));
      m.appendChild(n);
      return;
    }
    const m = head(nice(c.n), "Dossier citoyen · ID " + c.id);
    const lic = Array.isArray(c.lic) ? c.lic : [0, 0, 0, 0];
    const cards = el("div", "cards");
    cards.appendChild(card("Identité", Number(c.hasId) ? (Number(c.age) || 0) + " ans · " + (c.or || "—") : "Aucune carte", "var(--blue)", "i-id"));
    cards.appendChild(card("N° de carte", Number(c.hasId) ? String(c.num) : "—", "var(--cyan)", "i-badge"));
    cards.appendChild(card("Permis", lic.filter((x) => Number(x) === 1).length + " / 4 valides", "var(--green)", "i-badge"));
    cards.appendChild(card("Casier", (Array.isArray(c.rec) ? c.rec.length : 0) + " inscription(s)", Number(c.wl) ? "var(--red)" : "var(--amber)", "i-scale"));
    m.appendChild(cards);

    if (Number(c.wl) > 0) {
      const w = el("div", "wanted");
      w.appendChild(el("b", "", "★".repeat(Number(c.wl))));
      w.appendChild(el("span", "", "Recherché · " + (WANT[Number(c.wl)] || "") + (c.wr ? " — " + c.wr : "")));
      m.appendChild(w);
    }

    const s1 = el("div", "sec", "Permis & licences"); s1.appendChild(el("small", "", "Délivrer ou retirer d'un geste")); m.appendChild(s1);
    const lb = el("div", "box");
    lic.forEach((st, i) => {
      st = Number(st);
      const r = el("div", "lic");
      r.appendChild(el("span", "nm", LIC[i] || ("Permis " + i)));
      r.appendChild(el("span", "pill " + (st === 1 ? "ok" : st === 2 ? "bad" : "no"), st === 1 ? "Valide" : st === 2 ? "Retiré" : "Non possédé"));
      const b = el("button", "btn " + (st === 1 ? "red" : ""), st === 1 ? "Retirer" : "Délivrer"); b.type = "button";
      b.addEventListener("click", () => { if (S.busy) return; S.busy = true; setTimeout(() => (S.busy = false), 700); send(st === 1 ? "lictake" : "licgive", i); });
      r.appendChild(b);
      lb.appendChild(r);
    });
    m.appendChild(lb);

    const s2 = el("div", "sec", "Subvention"); s2.appendChild(el("small", "", Number(S.me.cSub) ? "Depuis la caisse de l'État" : "Grade 4 requis")); m.appendChild(s2);
    const sb = el("div", "box"); sb.style.padding = "clamp(8px,2.2vh,14px)";
    if (Number(S.me.cSub)) {
      const row = el("div", "row");
      const inp = el("input"); inp.type = "number"; inp.min = "1"; inp.max = "500000"; inp.placeholder = "Montant (FCFA)"; inp.inputMode = "numeric";
      const go = el("button", "btn", "Verser"); go.type = "button";
      go.addEventListener("click", () => {
        const v = Math.floor(Number(inp.value) || 0);
        if (v < 1 || v > 500000) { toast("Montant : 1 à 500 000 FCFA.", false); return; }
        send("subsidy", v); inp.value = ""; inp.blur();
      });
      row.appendChild(inp); row.appendChild(go); sb.appendChild(row);
      sb.appendChild(el("p", "help", "Versée sur le compte bancaire du citoyen. Caisse disponible : " + money(S.me.tr)));
    } else sb.appendChild(el("p", "help", "Tu n'as pas le grade nécessaire pour verser une subvention."));
    m.appendChild(sb);

    const s3 = el("div", "sec", "Casier judiciaire"); s3.appendChild(el("small", "", "5 dernières inscriptions")); m.appendChild(s3);
    const rb = el("div", "box");
    const rec = Array.isArray(c.rec) ? c.rec : [];
    if (!rec.length) rb.appendChild(el("p", "empty", "Casier vierge."));
    rec.forEach((r) => {
      const row = el("div", "rec");
      row.appendChild(el("span", "tg " + r[0], REC[r[0]] || "Note"));
      const t = el("div", "t"); t.appendChild(el("b", "", r[1] || "")); t.appendChild(el("small", "", dateFr(r[2]) + " · " + nice(r[3]))); row.appendChild(t);
      rb.appendChild(row);
    });
    m.appendChild(rb);
  }

  /* ---------- etat ---------- */
  function viewState() {
    const me = S.me;
    const m = head("État", "Caisse, TVA et annonces officielles");
    const cards = el("div", "cards");
    cards.appendChild(card("Caisse de l'État", money(me.tr), "var(--gold)", "i-money"));
    cards.appendChild(card("TVA boutiques", (Number(me.tax) || 0) + " %", "var(--blue)", "i-pct"));
    m.appendChild(cards);

    const can = Number(me.cTax) === 1;
    const s1 = el("div", "sec", "Fixer la TVA"); s1.appendChild(el("small", "", can ? "0 à 30 %" : "Grade 3 requis")); m.appendChild(s1);
    const tb = el("div", "box"); tb.style.padding = "clamp(8px,2.2vh,14px)";
    const row = el("div", "row");
    const step = el("div", "step");
    const minus = el("button", "", "−"), plus = el("button", "", "+"), val = el("b", "", S.tax + " %");
    minus.type = "button"; plus.type = "button";
    minus.disabled = !can; plus.disabled = !can;
    minus.addEventListener("click", () => { S.tax = Math.max(0, S.tax - 1); val.textContent = S.tax + " %"; });
    plus.addEventListener("click", () => { S.tax = Math.min(30, S.tax + 1); val.textContent = S.tax + " %"; });
    step.appendChild(minus); step.appendChild(val); step.appendChild(plus);
    const ap = el("button", "btn", "Appliquer"); ap.type = "button"; ap.disabled = !can;
    ap.addEventListener("click", () => { if (S.tax === Number(me.tax)) { toast("La TVA est déjà à " + S.tax + " %.", false); return; } send("tax", S.tax); });
    row.appendChild(step); row.appendChild(ap); tb.appendChild(row);
    tb.appendChild(el("p", "help", "La TVA des boutiques alimente la caisse de l'État. Tout le serveur est prévenu."));
    m.appendChild(tb);

    m.appendChild(el("div", "sec", "Annonce officielle"));
    const ab = el("div", "box"); ab.style.padding = "clamp(8px,2.2vh,14px)";
    const ta = el("textarea"); ta.maxLength = 100; ta.placeholder = "Ex : la mairie ouvre ses portes pour la délivrance des permis.";
    const r2 = el("div", "row"); r2.style.marginTop = "8px";
    const cnt = el("span", "help", "0 / 100"); cnt.style.margin = "0";
    const go = el("button", "btn", "Diffuser"); go.type = "button"; go.style.marginLeft = "auto";
    ta.addEventListener("input", () => { cnt.textContent = ta.value.length + " / 100"; });
    go.addEventListener("click", () => {
      const t = ta.value.replace(/\s+/g, " ").trim();
      if (t.length < 3) { toast("Annonce trop courte.", false); return; }
      send("announce", t); ta.value = ""; cnt.textContent = "0 / 100"; ta.blur();
    });
    r2.appendChild(cnt); r2.appendChild(go);
    ab.appendChild(ta); ab.appendChild(r2);
    m.appendChild(ab);
  }

  function render() {
    const me = S.me;
    $("meAv").textContent = initials(me.n);
    $("meN").textContent = nice(me.n) || "—";
    $("meR").textContent = (me.rn || "Membre") + " · grade " + (Number(me.rank) || 1);
    $("kTr").textContent = money(me.tr);
    $("kTax").textContent = (Number(me.tax) || 0) + " %";
    $("citMiniN").textContent = S.cit ? nice(S.cit.n) + " [" + S.cit.id + "]" : "Aucun";
    document.querySelectorAll("#nav button").forEach((b) => b.classList.toggle("on", b.dataset.view === S.view));
    if (S.view === "state") viewState(); else viewCitizen();
  }

  function apply(d, first) {
    if (d.me) { const changed = Number(d.me.tax) !== Number(S.me.tax); S.me = d.me; if (first || changed) S.tax = Number(d.me.tax) || 0; }
    if (first || d.cit !== undefined) S.cit = d.cit || null;
    if (first) S.view = S.cit ? "cit" : "state";
    render();
    if (d.msg) toast(d.msg, Number(d.ok) === 1);
  }

  document.querySelectorAll("#nav button").forEach((b) => b.addEventListener("click", () => { S.view = b.dataset.view; render(); }));
  $("gear").addEventListener("click", () => send("refresh"));
  $("quit").addEventListener("click", () => { if (bridge && typeof bridge.close === "function") { try { bridge.close(); } catch (_) {} } });

  window.GovApp = {
    openFromNative(raw) { apply(parse(raw), true); },
    onUpdateFromNative(raw) { apply(parse(raw), false); }
  };

  /* Apercu navigateur (hors jeu) */
  if (!bridge) {
    window.GovApp.openFromNative({
      me: { n: "Anzo_Smith", rank: 4, rn: "Ministre", tax: 5, tr: 2450000, cTax: 1, cSub: 1 },
      cit: { id: 3, n: "John_Doe", age: 24, or: "Abidjan", num: 482913, hasId: 1, lic: [1, 0, 2, 0], wl: 2, wr: "Vol a main armee",
             rec: [["w", "Avis de recherche 2 - Vol", 1761500000, "Officer_Kane"], ["f", "Exces de vitesse", 1761200000, "Officer_Kane"], ["l", "Permis retire", 1760900000, "Sgt_Moreau"]] }
    });
  }
  try { if (bridge && typeof bridge.ready === "function") bridge.ready(); } catch (_) {}
})();
</script>
</body>
</html>
