<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Garage</title>
<!--
  [v21] Garage Crestwood refait de zero : liste des vehicules a gauche, fiche du vehicule a droite
  (jauges etat / essence / usure, actions rapides, atelier, assurance, personnalisation, cles et vente).
  Serveur -> page : GarageApp.openFromNative(json) / onUpdateFromNative(json) / closeFromNative()  ("@garage" 9750-9752)
  Page -> serveur : SampGarage.cmd("take 12") -> /garact take 12   (le serveur re-verifie tout)
-->
<link rel="stylesheet" href="garage.css">
<link rel="stylesheet" href="../common/cw-perf.css">
</head>
<body>
<main class="gx" id="app" hidden>
  <aside class="gx-side">
    <header class="gx-head">
      <span class="gx-logo"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9h-5v-6H8v6H3z"/></svg></span>
      <div class="gx-title"><h1 id="gName">Garage</h1><p id="gSub">Mes véhicules</p></div>
      <button class="gx-x" id="close" type="button" aria-label="Fermer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </header>
    <div class="gx-wallet"><span><small>Liquide</small><b id="gCash">0 $</b></span><span><small>Banque</small><b id="gBank">0 $</b></span><span><small>Sortis</small><b id="gOut">0 / 2</b></span></div>
    <nav class="gx-filter" id="filter">
      <button type="button" data-f="all" class="on">Tous</button><button type="button" data-f="in">Au garage</button><button type="button" data-f="out">Sortis</button><button type="button" data-f="fav">Favoris</button>
    </nav>
    <div class="gx-list" id="list"></div>
  </aside>

  <section class="gx-main" id="main">
    <div class="gx-empty" id="empty"><b>Aucun véhicule</b><span>Achète un véhicule chez un concessionnaire : il sera rangé ici.</span></div>
    <div class="gx-detail" id="detail" hidden>
      <div class="gx-hero">
        <div class="gx-car" id="car"><i class="c1"></i><i class="c2"></i>
          <svg viewBox="0 0 120 44"><path d="M8 32c0-5 3-8 9-9l16-3 13-9c3-2 6-3 10-3h20c5 0 9 2 12 5l9 8 10 2c5 1 7 4 7 8v4H8z"/><circle cx="32" cy="36" r="7"/><circle cx="92" cy="36" r="7"/></svg>
        </div>
        <div class="gx-id">
          <p class="gx-state" id="vState">Au garage</p>
          <h2 id="vName">Véhicule</h2>
          <div class="gx-plate"><span>CW</span><b id="vPlate">CW-0000</b></div>
        </div>
        <button class="gx-fav" id="btnFav" type="button" aria-label="Favori"><svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg></button>
      </div>
      <div class="gx-gauges">
        <div class="gx-g" id="gHp"><i></i><b>0%</b><small>État</small></div>
        <div class="gx-g" id="gFu"><i></i><b>0%</b><small>Essence</small></div>
        <div class="gx-g" id="gWe"><i></i><b>0%</b><small>Usure</small></div>
        <div class="gx-g km" id="gKm"><i></i><b>0</b><small>km</small></div>
      </div>
      <div class="gx-quick">
        <button class="gx-btn main" id="btnTake" type="button">Sortir le véhicule</button>
        <button class="gx-btn" id="btnGps" type="button">GPS</button>
        <button class="gx-btn" id="btnLock" type="button">Verrouiller</button>
      </div>
      <nav class="gx-tabs" id="tabs">
        <button type="button" data-t="shop" class="on">Atelier</button><button type="button" data-t="ins">Assurance</button><button type="button" data-t="look">Style</button><button type="button" data-t="own">Clés &amp; vente</button>
      </nav>
      <div class="gx-pane" id="pane"></div>
    </div>
  </section>
  <div class="gx-toast" id="toast" hidden></div>
  <div class="gx-modal" id="modal" hidden><div class="gx-mcard"><h3 id="mTitle"></h3><p id="mText"></p><input id="mInput" type="text" maxlength="16" autocomplete="off"><div class="gx-mfoot"><button type="button" class="gx-btn" id="mNo">Annuler</button><button type="button" class="gx-btn main" id="mYes">Valider</button></div></div></div>
</main>
<script src="garage.js"></script>
</body>
</html>
