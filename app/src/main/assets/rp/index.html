<!DOCTYPE html>
<html lang="fr" data-th="grey">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Menu RP</title>
<!--
  Tablette RP Crestwood : accueil (raccourcis), animations, factures, annonces, urgences, mon personnage.
  Serveur -> page : RpApp.openFromNative(json) / RpApp.onUpdateFromNative(json)   (dialogues "@rp" 9690-9692)
  Page -> serveur : SampRp.action(type, {"arg":"..."}) -> /rpact <type> <arg>   (SAMP.java, liste blanche)
  Le serveur re-verifie tout (distance, argent, service...).
-->
<style>
:root{
  --frame:#33353e; --side:#2a2c34; --main:#363841; --card:#474953; --card2:#4f515b; --right1:#5a5c66; --right2:#45474f;
  --line:rgba(255,255,255,.07); --text:#f4f5f8; --soft:#c9ccd6; --muted:#9a9eab;
  --blue:#8b8b8b; --green:#3ad070; --cyan:#a6a6a6; --amber:#ffb84d; --red:#ff5a6a; --violet:#b2b2b2; --pink:#ff7ac6;
  --r-xl:4px; --r-lg:4px; --r-md:4px;
  --font:"Poppins","Montserrat","Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:transparent;font-family:var(--font);color:var(--text);-webkit-user-select:none;user-select:none}
button,input,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.hidden{display:none!important}
svg{display:block}

.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:2.2vh 2.4vw;background:radial-gradient(ellipse at 50% 50%,rgba(6,8,14,.35),rgba(6,8,14,0.56));animation:fade .2s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.frame{width:min(97vw,1080px);height:min(94vh,630px);padding:clamp(6px,1.6vh,12px);border-radius:4px;
  background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03));box-shadow:0 30px 80px rgba(0,0,0,.55);animation:pop .24s cubic-bezier(.2,.9,.3,1.15)}
@keyframes pop{from{transform:translateY(12px) scale(.97);opacity:.4}to{transform:none;opacity:1}}
.panel{height:100%;display:grid;grid-template-columns:clamp(128px,19%,200px) minmax(0,1fr) clamp(150px,23%,250px);border-radius:var(--r-xl);overflow:hidden;background:var(--frame)}

/* ---------- barre laterale ---------- */
.side{display:flex;flex-direction:column;align-items:center;min-height:0;padding:clamp(10px,2.6vh,22px) 10px clamp(8px,2.2vh,18px);background:var(--side)}
.logo{position:relative;flex:none;width:clamp(46px,14vh,88px);height:clamp(46px,14vh,88px);border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 30%,#666666,rgba(0,0,0,0.624) 72%);box-shadow:0 0 0 3px rgba(255,255,255,.06),0 10px 28px rgba(0,0,0,.45),inset 0 -10px 24px rgba(0,0,0,.4)}
.logo b{font-size:clamp(13px,4.4vh,24px);font-weight:900;letter-spacing:.04em}
.logo small{position:absolute;bottom:15%;font-size:clamp(5px,1.4vh,8px);font-weight:800;letter-spacing:.16em;color:rgba(255,255,255,.7)}
.fname{margin:clamp(5px,1.6vh,12px) 0 clamp(6px,2vh,16px);font-size:clamp(11px,3.2vh,16px);font-weight:800;letter-spacing:.06em;text-transform:uppercase;text-align:center}
.nav{width:100%;display:flex;flex-direction:column;gap:clamp(1px,.6vh,6px);overflow-y:auto;scrollbar-width:none;min-height:0}
.nav::-webkit-scrollbar{display:none}
.nav button{position:relative;display:flex;align-items:center;gap:clamp(8px,1.4vw,12px);width:100%;padding:clamp(5px,1.5vh,11px) clamp(8px,1.2vw,14px);border-radius:4px;
  font-size:clamp(10px,2.7vh,13.5px);font-weight:700;color:var(--soft);transition:background .15s,color .15s;text-align:left}
.nav button svg{width:clamp(15px,4.2vh,22px);height:clamp(15px,4.2vh,22px);flex:none}
.nav button.on{color:var(--blue);background:rgba(139,139,139,0.08)}
.nav button:active{background:rgba(255,255,255,.05)}
.badge{margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:4px;display:grid;place-items:center;font-size:10px;font-weight:800;background:var(--red);color:#fff}
.side .quit{margin-top:auto;flex:none;display:flex;align-items:center;gap:12px;padding:clamp(5px,1.6vh,10px) 14px;border-radius:4px;font-size:clamp(10.5px,2.8vh,14px);font-weight:700;color:var(--soft)}
.side .quit svg{width:clamp(16px,4.4vh,22px);height:clamp(16px,4.4vh,22px)}
.side .quit:active{background:rgba(255,90,106,.15);color:#fff}

/* ---------- zone centrale ---------- */
.main{min-width:0;min-height:0;padding:clamp(6px,1.8vh,12px) 0;display:flex}
.main-in{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;margin:0 clamp(6px,1vw,10px);padding:clamp(12px,3.2vh,22px) clamp(12px,2vw,22px);border-radius:var(--r-lg);background:var(--main);
  overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.main-in::-webkit-scrollbar{display:none}
.h1{font-size:clamp(15px,4.4vh,23px);font-weight:800;line-height:1.1}
.sub{margin-top:2px;font-size:clamp(9.5px,2.5vh,12.5px);color:var(--soft);font-weight:500}
.sec{font-size:clamp(11.5px,3.3vh,16px);font-weight:800;margin:clamp(10px,3vh,20px) 0 clamp(6px,1.6vh,10px)}
.empty{padding:clamp(10px,4vh,26px) 0;text-align:center;font-size:clamp(9.5px,2.6vh,12.5px);color:var(--muted)}
.loading{margin:auto;color:var(--muted);font-size:clamp(10px,2.8vh,13px)}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(6px,1.6vh,12px);margin-top:clamp(10px,3vh,18px)}
.stat{position:relative;padding:clamp(8px,2vh,13px) clamp(10px,1.4vw,14px) clamp(8px,2vh,13px) clamp(13px,1.8vw,18px);border-radius:var(--r-md);background:linear-gradient(180deg,var(--card2),var(--card));overflow:hidden;text-align:left}
.stat::before{content:"";position:absolute;left:0;top:18%;bottom:18%;width:3px;border-radius:0 3px 3px 0;background:var(--c,var(--blue))}
.stat b{display:block;font-size:clamp(11px,3.1vh,15.5px);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat small{display:block;font-size:clamp(8.5px,2.2vh,11px);color:var(--soft);font-weight:600}
button.stat:active{transform:scale(.98)}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(88px,15vw,124px),1fr));gap:clamp(6px,1.6vh,11px)}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:clamp(6px,1.6vh,12px);min-height:clamp(62px,17vh,96px);padding:clamp(8px,2.2vh,14px);
  border-radius:var(--r-md);background:linear-gradient(180deg,var(--card2),var(--card));box-shadow:0 8px 18px rgba(0,0,0,.16);text-align:left}
.tile .ti{width:clamp(26px,7.4vh,38px);height:clamp(26px,7.4vh,38px);border-radius:4px;display:grid;place-items:center;background:color-mix(in srgb,var(--c,var(--blue)) 22%,transparent);color:var(--c,var(--blue))}
.tile .ti svg{width:58%;height:58%}
.tile b{font-size:clamp(9.5px,2.6vh,13px);font-weight:700;line-height:1.15}
.tile .badge{position:absolute;top:8px;right:8px;margin:0}
.tile.lock{opacity:.4}
.tile:active{transform:scale(.97)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:clamp(5px,1.5vh,8px) 12px;border-radius:3px;font-size:clamp(9px,2.3vh,11.5px);font-weight:700;color:var(--soft);background:rgba(255,255,255,.05);white-space:nowrap}
.chip.on{background:rgba(139,139,139,0.24);color:#fff;box-shadow:inset 0 0 0 1px rgba(139,139,139,0.6)}
.chip:active{transform:scale(.96)}

/* animations */
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(84px,13vw,112px),1fr));gap:clamp(5px,1.4vh,9px);margin-top:clamp(8px,2.2vh,14px)}
.ab{display:flex;align-items:center;gap:8px;padding:clamp(7px,2vh,11px) 10px;border-radius:4px;background:rgba(255,255,255,.045);font-size:clamp(9.5px,2.5vh,12.5px);font-weight:700;text-align:left}
.ab i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--c,var(--blue));box-shadow:0 0 8px var(--c,var(--blue))}
.ab.on{background:rgba(139,139,139,0.25);box-shadow:inset 0 0 0 1px rgba(139,139,139,0.7)}
.ab:active{transform:scale(.96)}
.stopbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:clamp(8px,2.4vh,14px)}

/* lignes / cartes de liste */
.row{display:flex;align-items:center;gap:10px;padding:clamp(7px,1.8vh,11px) 12px;border-radius:4px;background:rgba(255,255,255,.04)}
.row + .row{margin-top:clamp(4px,1.1vh,7px)}
.row .who{flex:1;min-width:0}
.row .who b{display:block;font-size:clamp(10px,2.7vh,13px);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .who small{display:block;font-size:clamp(8.5px,2.2vh,11px);color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{flex:none;font-size:clamp(11px,3vh,15px);font-weight:800;color:var(--green);white-space:nowrap}
.st{flex:none;padding:3px 9px;border-radius:3px;font-size:clamp(8px,2vh,10px);font-weight:800}
.st.s0{background:rgba(255,184,77,.18);color:var(--amber)} .st.s1{background:rgba(58,208,112,.18);color:var(--green)}
.st.s2{background:rgba(255,90,106,.18);color:var(--red)} .st.s3{background:rgba(255,255,255,.08);color:var(--muted)}
.bill{padding:clamp(9px,2.4vh,14px) clamp(10px,1.4vw,14px);border-radius:var(--r-md);background:linear-gradient(180deg,var(--card2),var(--card));box-shadow:0 8px 18px rgba(0,0,0,.16)}
.bill + .bill{margin-top:clamp(6px,1.6vh,10px)}
.bill .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.bill .top b{font-size:clamp(10.5px,2.9vh,14px);font-weight:800}
.bill .top small{display:block;font-size:clamp(8.5px,2.2vh,11px);color:var(--soft)}
.bill .big{font-size:clamp(14px,4.4vh,22px);font-weight:900;color:var(--green);white-space:nowrap}
.bill p{margin:6px 0 10px;font-size:clamp(9.5px,2.5vh,12.5px);color:var(--text)}
.acts{display:flex;flex-wrap:wrap;gap:6px}

/* formulaires */
.form{display:flex;flex-direction:column;gap:clamp(6px,1.8vh,10px)}
.lbl{font-size:clamp(8.5px,2.2vh,11px);font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.in{width:100%;padding:clamp(7px,2vh,11px) 12px;border-radius:4px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:clamp(10px,2.7vh,13px);outline:none;color-scheme:dark;-webkit-user-select:text;user-select:text}
.in:focus{border-color:var(--blue)}
textarea.in{resize:none;height:clamp(52px,15vh,84px)}
.hint{font-size:clamp(8.5px,2.2vh,11px);color:var(--muted)}
.btn{padding:clamp(6px,1.8vh,10px) 16px;border-radius:4px;font-size:clamp(9.5px,2.6vh,13px);font-weight:800;background:var(--blue);color:#fff;box-shadow:0 6px 16px rgba(139,139,139,0.35);white-space:nowrap}
.btn.green{background:var(--green);box-shadow:0 6px 16px rgba(58,208,112,.3);color:#062514}
.btn.red{background:rgba(255,90,106,.16);color:var(--red);box-shadow:none}
.btn.ghost{background:rgba(255,255,255,.07);box-shadow:none;color:var(--text)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.4}

/* annonces */
.ad{padding:clamp(8px,2.2vh,12px) 12px;border-radius:4px;background:rgba(255,255,255,.04);border-left:3px solid var(--c,var(--blue))}
.ad + .ad{margin-top:clamp(5px,1.4vh,8px)}
.ad .h{display:flex;align-items:center;gap:8px;font-size:clamp(8.5px,2.2vh,11px);color:var(--soft)}
.ad .h em{font-style:normal;font-weight:800;color:var(--c,var(--blue));text-transform:uppercase;letter-spacing:.05em}
.ad .h time{margin-left:auto;color:var(--muted)}
.ad p{margin-top:4px;font-size:clamp(10px,2.7vh,13px);font-weight:500;line-height:1.35}
.ad .del{margin-left:6px;color:var(--red);font-weight:800}

/* urgences */
.svcs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(6px,1.6vh,10px)}
.svc{display:flex;flex-direction:column;align-items:center;gap:6px;padding:clamp(8px,2.4vh,14px) 6px;border-radius:var(--r-md);background:linear-gradient(180deg,var(--card2),var(--card));font-size:clamp(9px,2.4vh,12px);font-weight:800}
.svc .ti{width:clamp(28px,8vh,42px);height:clamp(28px,8vh,42px);border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}
.svc .ti svg{width:55%;height:55%}
.svc.on{box-shadow:inset 0 0 0 2px var(--c);background:color-mix(in srgb,var(--c) 14%,var(--card))}
.callme{display:flex;align-items:center;gap:12px;padding:clamp(9px,2.4vh,14px);border-radius:var(--r-md);background:rgba(255,106,77,.12);border:1px solid rgba(255,106,77,.35)}
.pulse{flex:none;width:12px;height:12px;border-radius:50%;background:#ff6a4d;box-shadow:0 0 0 0 rgba(255,106,77,.6);animation:pulse 1.4s infinite}
.pulse.ok{background:var(--green);animation:none;box-shadow:0 0 10px var(--green)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,106,77,.6)}70%{box-shadow:0 0 0 12px rgba(255,106,77,0)}100%{box-shadow:0 0 0 0 rgba(255,106,77,0)}}
.dist{flex:none;font-size:clamp(9px,2.3vh,11.5px);font-weight:800;color:var(--cyan)}

/* personnage */
.idcard{display:grid;grid-template-columns:auto 1fr;gap:clamp(10px,1.8vw,18px);align-items:center;padding:clamp(10px,2.8vh,16px);border-radius:var(--r-md);background:linear-gradient(135deg,#575757,rgba(255,255,255,0.097));box-shadow:0 10px 24px rgba(0,0,0,.25)}
.idcard .ph{width:clamp(52px,16vh,86px);aspect-ratio:1;border-radius:4px;display:grid;place-items:center;background:rgba(255,255,255,.12);font-size:clamp(18px,6vh,32px);font-weight:900}
.idcard b{display:block;font-size:clamp(12px,3.6vh,18px);font-weight:800}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 12px;margin-top:6px}
.kv span{font-size:clamp(8px,2vh,10px);color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.05em}
.kv strong{display:block;font-size:clamp(9.5px,2.6vh,12.5px);font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.lic{padding:clamp(6px,1.8vh,10px) 6px;border-radius:4px;text-align:center;font-size:clamp(8.5px,2.2vh,11px);font-weight:700;background:rgba(255,255,255,.04);color:var(--muted)}
.lic.on{background:rgba(58,208,112,.14);color:var(--green)}
.stars{color:var(--amber);letter-spacing:2px}

/* ---------- colonne de droite ---------- */
.right{position:relative;display:flex;flex-direction:column;align-items:center;padding:clamp(14px,4vh,28px) clamp(10px,1.6vw,18px) clamp(10px,3vh,20px);background:linear-gradient(180deg,var(--right1),var(--right2));min-height:0}
.gear{position:absolute;top:clamp(10px,3vh,18px);right:clamp(10px,1.6vw,18px);color:rgba(255,255,255,.75)}
.gear svg{width:clamp(16px,4.6vh,24px);height:clamp(16px,4.6vh,24px)}
.gear:active{transform:rotate(60deg)}
.me-av{width:clamp(58px,19vh,110px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#ffffff,#dfe1e6);
  color:#3a3d47;font-size:clamp(18px,6.4vh,36px);font-weight:800;box-shadow:0 12px 30px rgba(0,0,0,.3),0 0 0 5px rgba(255,255,255,.08)}
.me-n{margin-top:clamp(8px,2.4vh,14px);font-size:clamp(12px,3.8vh,19px);font-weight:800;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-r{margin-top:2px;font-size:clamp(9px,2.5vh,12.5px);color:rgba(255,255,255,.72);font-weight:600;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wallet{width:100%;display:flex;flex-direction:column;gap:6px;margin-top:clamp(10px,3.2vh,22px)}
.wl{display:flex;align-items:center;justify-content:space-between;padding:clamp(6px,1.7vh,10px) 12px;border-radius:4px;background:rgba(20,22,28,.3)}
.wl small{font-size:clamp(8.5px,2.2vh,11px);color:rgba(255,255,255,.7);font-weight:600}
.wl b{font-size:clamp(10px,2.8vh,13.5px);font-weight:800}
.now{width:100%;margin-top:auto;padding:clamp(8px,2vh,12px);border-radius:4px;background:rgba(20,22,28,.35);display:flex;align-items:center;gap:8px}
.now p{flex:1;min-width:0;font-size:clamp(8.5px,2.3vh,11.5px);color:rgba(255,255,255,.8);font-weight:600}

.toast{position:fixed;left:50%;bottom:4vh;transform:translateX(-50%);max-width:80vw;padding:clamp(7px,2vh,11px) 18px;border-radius:4px;font-size:clamp(10px,2.7vh,13px);font-weight:700;
  background:rgba(22,60,38,0.62);color:#bff5d2;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:9;animation:fade .15s}
.toast.err{background:rgba(70,20,26,0.62);color:#ffc9cf}

/* ---------- codes promo ---------- */
.packs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(6px,1.4vw,10px)}
.pack{position:relative;display:flex;flex-direction:column;gap:3px;padding:clamp(8px,2.2vh,14px) clamp(8px,1.2vw,12px);border-radius:4px;background:rgba(255,255,255,.05);border:1px solid var(--line);overflow:hidden}
.pack::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c)}
.pack small{font-size:clamp(8px,2vh,10px);font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--c)}
.pack b{font-size:clamp(11px,3vh,15px);font-weight:800}
.pack span{font-size:clamp(8.5px,2.2vh,11px);color:var(--soft)}
.pack em{margin-top:auto;padding-top:4px;font-style:normal;font-size:clamp(8px,2vh,10px);color:var(--muted)}
.promo-in{display:flex;gap:8px}
.promo-in .in{text-transform:uppercase;letter-spacing:.14em;font-weight:800}
.done{display:flex;align-items:center;gap:10px;padding:clamp(8px,2vh,12px) 14px;border-radius:4px;background:rgba(58,208,112,.1);color:#bff3d2;font-size:clamp(9.5px,2.5vh,12.5px);font-weight:600}
.tag{padding:2px 8px;border-radius:3px;font-size:clamp(8px,2vh,10px);font-weight:800;background:rgba(255,255,255,.08);color:var(--c,#fff);white-space:nowrap}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em}
@media (max-width:620px){ .panel{grid-template-columns:clamp(110px,24%,150px) minmax(0,1fr)} .right{display:none} .stats{grid-template-columns:repeat(2,minmax(0,1fr))} }
</style>
<link rel="stylesheet" href="../common/crestwood-theme.css" />
  <link rel="stylesheet" href="../common/cw-pro.css">
  <link rel="stylesheet" href="../common/cw-perf.css">
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>

<main class="ov" id="ov">
  <div class="frame">
    <div class="panel">
      <aside class="side">
        <div class="logo"><b>CW</b><small>ROLEPLAY</small></div>
        <div class="fname">Crestwood RP</div>
        <nav class="nav" id="nav">
          <button type="button" data-view="hub" class="on"><svg><use href="#i-home"/></svg>Accueil</button>
          <button type="button" data-view="anim"><svg><use href="#i-run"/></svg>Animations</button>
          <button type="button" data-view="bill"><svg><use href="#i-bill"/></svg>Factures<span class="badge hidden" id="bBills">0</span></button>
          <button type="button" data-view="ads"><svg><use href="#i-ads"/></svg>Annonces</button>
          <button type="button" data-view="sos"><svg><use href="#i-sos"/></svg>Urgences<span class="badge hidden" id="bCalls">0</span></button>
          <button type="button" data-view="me"><svg><use href="#i-user"/></svg>Mon perso</button>
          <button type="button" data-view="promo"><svg><use href="#i-gift"/></svg>Codes promo</button>
          <button type="button" data-view="law" id="navLaw" class="hidden"><svg><use href="#i-cop"/></svg><span id="navLawTxt">Centrale</span></button>
        </nav>
        <button type="button" class="quit" id="quit"><svg><use href="#i-out"/></svg>Fermer</button>
      </aside>

      <section class="main"><div class="main-in" id="mainIn"><div class="loading">Chargement…</div></div></section>

      <aside class="right">
        <button type="button" class="gear" id="gear" aria-label="Actualiser"><svg><use href="#i-gear"/></svg></button>
        <div class="me-av" id="meAv">?</div>
        <div class="me-n" id="meN">—</div>
        <div class="me-r" id="meR">Citoyen</div>
        <div class="wallet">
          <div class="wl"><small>Liquide</small><b id="wCash">0 FCFA</b></div>
          <div class="wl"><small>Banque</small><b id="wBank">0 FCFA</b></div>
        </div>
        <div class="now" id="now"><span class="pulse ok" id="nowDot"></span><p id="nowTxt">Prêt pour le RP.</p></div>
      </aside>
    </div>
  </div>
</main>

<script>
(function () {
  "use strict";
  const bridge = window.SampRp || null;
  const $ = (id) => document.getElementById(id);
  const S = { v: "hub", me: {}, cnt: {}, hub: {}, cur: "", bin: [], bout: [], near: [], to: -1, forFac: "", max: 1000000,
    ads: [], price: 150, cd: 0, cdAt: 0, calls: [], my: 0, p: {}, animCat: "all", billTab: "in", billTo: -1, adCat: "vente", svcSel: "police", loading: true };

  const ANIMS = [
    ["salut", "Saluer", "g"], ["pointer", "Pointer", "g"], ["crier", "Crier", "g"], ["non", "Non de la tête", "g"], ["rire", "Rire", "g"],
    ["bras", "Bras croisés", "g"], ["reflechir", "Réfléchir", "g"], ["regarder", "Regarder autour", "g"], ["gang1", "Signe 1", "g"], ["gang2", "Signe 2", "g"],
    ["mainsair", "Mains en l'air", "g"],
    ["assis", "Assis (homme)", "r"], ["assisf", "Assise (femme)", "r"], ["allonge", "Allongé", "r"], ["bronzer", "Bronzer", "r"], ["dormir", "Dormir", "r"],
    ["adosse", "Adossé", "r"], ["fumer", "Fumer", "r"], ["boire", "Boire", "r"], ["telephone", "Téléphoner", "r"], ["taichi", "Tai-chi", "r"],
    ["danse1", "Danse 1", "d"], ["danse2", "Danse 2", "d"], ["danse3", "Danse 3", "d"], ["danse4", "Danse 4", "d"], ["danse5", "Danse 5", "d"], ["rap", "Rap", "d"],
    ["reparer", "Réparer", "w"], ["fouiller", "Fouiller", "w"], ["ordi", "Ordinateur", "w"], ["cpr", "Massage cardiaque", "w"], ["garde", "Monter la garde", "w"],
    ["blesse", "Blessé au sol", "w"], ["peur", "Se protéger", "w"]
  ];
  const ACAT = { all: ["Tout", "#4d82ff"], g: ["Gestes", "#3db5ff"], r: ["Repos", "#3ad070"], d: ["Danse", "#ff7ac6"], w: ["Travail", "#ffb84d"] };
  const ADCAT = { vente: ["Vente", "#3ad070"], achat: ["Achat", "#3db5ff"], service: ["Service", "#ffb84d"], emploi: ["Emploi", "#b48cff"], event: ["Événement", "#ff7ac6"] };
  const SVC = { police: ["Police", "i-cop", "#4d82ff"], medic: ["Médecins", "i-med", "#ff5a6a"], mech: ["Mécano", "i-wrench", "#ffb84d"], taxi: ["Taxi", "i-taxi", "#f5d142"] };
  const FIGHT = [[4, "Normal"], [5, "Boxe"], [6, "Kung-fu"], [7, "Genou-tête"], [15, "Saisie-coup"], [16, "Coude"]];
  const LICS = ["Voiture", "Armes", "Poids lourds", "Bateau"];

  /* ---------- utilitaires ---------- */
  function parse(raw) { if (!raw) return {}; if (typeof raw === "object") return raw; try { return JSON.parse(raw); } catch (_) { return {}; } }
  function money(v) { return (Math.max(0, Math.floor(Number(v) || 0))).toLocaleString("fr-FR") + " FCFA"; }
  function nm(s) { return String(s || "").replace(/_/g, " "); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
  function initials(s) { const p = nm(s).trim().split(/\s+/); return ((p[0] || "?")[0] + (p[1] ? p[1][0] : "")).toUpperCase(); }
  function ago(ts) {
    const d = Math.max(0, Math.floor(Date.now() / 1000 - Number(ts || 0)));
    if (d < 60) return "à l'instant"; if (d < 3600) return "il y a " + Math.floor(d / 60) + " min";
    if (d < 86400) return "il y a " + Math.floor(d / 3600) + " h"; return "il y a " + Math.floor(d / 86400) + " j";
  }
  function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function icon(id) { return '<svg><use href="#' + id + '"/></svg>'; }
  let toastTimer = 0;
  function toast(msg, ok) {
    if (!msg) return;
    let t = document.querySelector(".toast"); if (!t) { t = el("div", "toast"); document.body.appendChild(t); }
    t.className = "toast" + (ok ? "" : " err"); t.textContent = msg;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2600);
  }
  function send(type, arg) {
    if (!bridge || typeof bridge.action !== "function") { console.log("[rp]", type, arg); return; }
    try { bridge.action(type, JSON.stringify({ arg: arg == null ? "" : String(arg) })); } catch (_) {}
  }
  function hapticLock(btn) { if (!btn) return; btn.disabled = true; setTimeout(() => { btn.disabled = false; }, 700); }

  /* ---------- cadre (nav, profil a droite) ---------- */
  function renderFrame() {
    document.querySelectorAll("#nav button").forEach((b) => b.classList.toggle("on", b.dataset.view === S.v));
    $("navLaw").classList.toggle("hidden", !Number(S.me.law));
    $("navLawTxt").textContent = "Centrale " + lawName();
    const bills = Number(S.cnt.bills) || 0, calls = Number(S.cnt.calls) || 0;
    $("bBills").textContent = bills; $("bBills").classList.toggle("hidden", !bills);
    $("bCalls").textContent = calls; $("bCalls").classList.toggle("hidden", !calls);
    $("meAv").textContent = initials(S.me.n || "?");
    $("meN").textContent = S.me.n || "—";
    $("meR").textContent = S.me.fac ? (S.me.fac + (S.me.rk ? " · " + S.me.rk : "")) : "Citoyen";
    $("wCash").textContent = money(S.me.cash);
    $("wBank").textContent = money(S.me.bank);
    const a = ANIMS.find((x) => x[0] === S.cur);
    $("nowDot").className = "pulse" + (a ? "" : " ok");
    $("nowTxt").textContent = a ? "Animation : " + a[1] : (S.my ? "Appel d'urgence en cours…" : "Prêt pour le RP.");
  }

  function head(m, title, sub) {
    m.appendChild(el("div", "h1", esc(title)));
    if (sub) m.appendChild(el("div", "sub", esc(sub)));
  }

  /* ---------- Accueil ---------- */
  function viewHub(m) {
    const first = nm(S.me.n).split(" ")[0] || "";
    const d = new Date();
    head(m, "Bonjour " + first, d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" }) + " · tout ton RP au même endroit");
    const st = el("div", "stats");
    const stat = (label, value, c, go) => {
      const b = el(go ? "button" : "div", "stat", "<b>" + esc(value) + "</b><small>" + esc(label) + "</small>");
      b.style.setProperty("--c", c); if (go) { b.type = "button"; b.addEventListener("click", () => goView(go)); }
      st.appendChild(b);
    };
    const num = (v) => (Math.max(0, Math.floor(Number(v) || 0))).toLocaleString("fr-FR");
    stat("Liquide (FCFA)", num(S.me.cash), "#3ad070");
    stat("Banque (FCFA)", num(S.me.bank), "#3db5ff");
    stat("Factures à régler", String(Number(S.cnt.bills) || 0), "#ffb84d", "bill");
    if (S.me.svc) stat("Appels " + (SVC[S.me.svc] ? SVC[S.me.svc][0] : ""), String(Number(S.cnt.calls) || 0), "#ff5a6a", "sos");
    else stat("Urgences", "Appeler", "#ff5a6a", "sos");
    m.appendChild(st);

    m.appendChild(el("div", "sec", "Systèmes RP"));
    const t1 = el("div", "tiles");
    const tile = (parent, label, ic, c, fn, opt) => {
      opt = opt || {};
      const b = el("button", "tile" + (opt.lock ? " lock" : ""), '<span class="ti">' + icon(ic) + "</span><b>" + esc(label) + "</b>" + (opt.badge ? '<span class="badge">' + opt.badge + "</span>" : ""));
      b.type = "button"; b.style.setProperty("--c", c);
      b.addEventListener("click", () => { if (opt.lock) { toast(opt.lock, false); return; } fn(); });
      parent.appendChild(b);
    };
    tile(t1, "Animations", "i-run", "#3db5ff", () => goView("anim"));
    tile(t1, "Factures", "i-bill", "#ffb84d", () => goView("bill"), { badge: Number(S.cnt.bills) || 0 });
    tile(t1, "Annonces", "i-ads", "#3ad070", () => goView("ads"));
    tile(t1, "Urgences", "i-sos", "#ff5a6a", () => goView("sos"), { badge: Number(S.cnt.calls) || 0 });
    tile(t1, "Mon perso", "i-user", "#b48cff", () => goView("me"));
    tile(t1, "Codes promo", "i-gift", "#f5d142", () => goView("promo"));
    if (Number(S.me.law)) tile(t1, "Centrale " + lawName(), "i-cop", "#5b8cff", () => goView("law"));
    m.appendChild(t1);

    m.appendChild(el("div", "sec", "Raccourcis"));
    const t2 = el("div", "tiles");
    tile(t2, "Inventaire", "i-bag", "#4d82ff", () => send("go", "inv"));
    tile(t2, "Mes papiers", "i-id", "#3db5ff", () => send("go", "papers"));
    tile(t2, "Mes permis", "i-badge", "#3ad070", () => send("go", "lic"));
    tile(t2, "Véhicule", "i-car", "#ffb84d", () => send("go", "veh"), { lock: Number(S.hub.veh) ? "" : "Aucun véhicule à proximité." });
    tile(t2, "Tenues", "i-shirt", "#ff7ac6", () => send("go", "outfit"));
    tile(t2, "Garage", "i-car", "#1ec8ff", () => send("go", "garage"));
    tile(t2, "Ma faction", "i-shield", "#4d82ff", () => send("go", "fac"), { lock: Number(S.me.inFac) ? "" : "Tu ne fais partie d'aucune faction." });
    if (Number(S.hub.gov)) tile(t2, "Gouvernement", "i-gov", "#ffcc33", () => send("go", "gov"));
    tile(t2, "Immobilier", "i-home", "#33ccff", () => send("go", "house"));
    tile(t2, "Pêche", "i-fish", "#3db5ff", () => send("go", "fish"));
    tile(t2, "Carte / GPS", "i-map", "#3ad070", () => send("go", "map"));
    tile(t2, "Téléphone", "i-phone", "#3db5ff", () => send("go", "phone"));
    tile(t2, "Support", "i-help", "#ff5a6a", () => send("go", "report"));
    tile(t2, "Paramètres", "i-settings", "#9a9eab", () => send("go", "settings"));
    m.appendChild(t2);
  }

  /* ---------- Animations ---------- */
  function viewAnim(m) {
    head(m, "Animations", "Touche une animation pour la jouer. Bouge ou appuie sur Stop pour arrêter.");
    const bar = el("div", "stopbar");
    const chips = el("div", "chips");
    Object.keys(ACAT).forEach((k) => {
      const c = el("button", "chip" + (S.animCat === k ? " on" : ""), esc(ACAT[k][0]));
      c.type = "button"; c.addEventListener("click", () => { S.animCat = k; render(); });
      chips.appendChild(c);
    });
    const stop = el("button", "btn red", "Stop");
    stop.type = "button"; stop.addEventListener("click", () => { hapticLock(stop); send("animstop"); });
    bar.appendChild(chips); bar.appendChild(stop);
    m.appendChild(bar);
    const g = el("div", "agrid");
    ANIMS.filter((a) => S.animCat === "all" || a[2] === S.animCat).forEach((a) => {
      const b = el("button", "ab" + (S.cur === a[0] ? " on" : ""), "<i></i>" + esc(a[1]));
      b.type = "button"; b.style.setProperty("--c", ACAT[a[2]][1]);
      b.addEventListener("click", () => { S.cur = a[0]; renderFrame(); render(); send("anim", a[0]); });
      g.appendChild(b);
    });
    m.appendChild(g);
  }

  /* ---------- Factures ---------- */
  const BST = ["En attente", "Payée", "Refusée", "Annulée"];
  function viewBill(m) {
    head(m, "Factures", "Facture un joueur proche, règle tes factures en liquide ou par carte.");
    const tabs = el("div", "chips"); tabs.style.marginTop = "clamp(8px,2.2vh,14px)";
    [["in", "Reçues (" + S.bin.length + ")"], ["out", "Envoyées"], ["new", "Nouvelle facture"]].forEach(([k, l]) => {
      const c = el("button", "chip" + (S.billTab === k ? " on" : ""), esc(l)); c.type = "button";
      c.addEventListener("click", () => { S.billTab = k; render(); });
      tabs.appendChild(c);
    });
    m.appendChild(tabs);

      const id = String(idIn.value).replace(/\D/g, ""), r = why.value.trim();
      if (!id) { toast("Indique l'ID du joueur.", false); return; }
      if (r.length < 3) { toast("Indique une raison.", false); return; }
      hapticLock(go); send("lawwanted", id + " " + lvl + " " + r); why.value = ""; why.blur(); idIn.blur();
    });
    row.appendChild(idIn); row.appendChild(go);
    f.appendChild(lv); f.appendChild(why); f.appendChild(row);
    m.appendChild(f);

    m.appendChild(el("div", "sec", "Agents en service"));
    if (!agents.length) m.appendChild(el("div", "empty", "Aucun agent connecté."));
    agents.forEach((g) => {
      const [id, who, unit, rank, dist] = g;
      const r = el("div", "row", '<div class="who"><b>' + esc(nm(who)) + "</b><small>" + esc(unit) + (rank ? " · " + esc(rank) : "") + '</small></div><span class="dist">' + (dist >= 1000 ? (dist / 1000).toFixed(1) + " km" : dist + " m") + "</span>");
      if (who !== S.me.u) { const b = el("button", "btn ghost", "GPS"); b.type = "button"; b.addEventListener("click", () => { hapticLock(b); send("lawgps", id); }); r.appendChild(b); }
      m.appendChild(r);
    });

    if (t === 6 || t === 1) {
      m.appendChild(el("div", "sec", "Dossiers d'enquête"));
      const notes = Array.isArray(L.notes) ? L.notes : [];
      if (!notes.length) m.appendChild(el("div", "empty", "Aucune note."));
      notes.forEach((n) => {
        const [nid, target, author, txt, ts] = n;
        const r = el("div", "row", '<div class="who"><b>' + esc(nm(target)) + "</b><small>" + esc(txt) + " · " + esc(nm(author)) + " · " + ago(ts) + "</small></div>");
        const x = el("button", "btn red", "×"); x.type = "button"; x.addEventListener("click", () => { hapticLock(x); send("lawnotedel", nid); });
        r.appendChild(x); m.appendChild(r);
      });
      const nf = el("div", "form"); nf.style.marginTop = "8px";
      const tg = el("input", "in"); tg.placeholder = "Suspect : Prenom_Nom"; tg.maxLength = 24;
      const tx = el("input", "in"); tx.placeholder = "Note (vu au port avec une Sultan noire…)"; tx.maxLength = 90;
      const add = el("button", "btn", "Ajouter au dossier"); add.type = "button";
      add.addEventListener("click", () => {
        const a1 = tg.value.trim().replace(/\s+/g, "_").replace(/[^A-Za-z0-9_]/g, ""), a2 = tx.value.trim();
        if (a1.length < 3 || a2.length < 3) { toast("Nom et note obligatoires.", false); return; }
        hapticLock(add); send("lawnote", a1 + " " + a2); tx.value = ""; tx.blur(); tg.blur();
      });
      const aa = el("div", "acts"); aa.appendChild(add);
      nf.appendChild(tg); nf.appendChild(tx); nf.appendChild(aa); m.appendChild(nf);
    }

    if (t === 9) {
      m.appendChild(el("div", "sec", "Alerte militaire"));
      if (L.alert) m.appendChild(el("div", "row", '<div class="who"><b>Dernière alerte</b><small>' + esc(L.alert) + " · " + ago(L.alertTs) + "</small></div>"));
      const af = el("div", "form");
      const at = el("input", "in"); at.placeholder = "Texte de l'alerte (zone militaire fermée, couvre-feu…)"; at.maxLength = 90;
      const ab = el("button", "btn red", "Diffuser l'alerte à tout le serveur"); ab.type = "button";
      ab.addEventListener("click", () => { const v = at.value.trim(); if (v.length < 5) { toast("Texte trop court.", false); return; } hapticLock(ab); send("lawalert", v); at.value = ""; at.blur(); });
      const aa = el("div", "acts"); aa.appendChild(ab); af.appendChild(at); af.appendChild(aa); m.appendChild(af);
    }

    m.appendChild(el("div", "sec", "Commandes"));
    m.appendChild(el("div", "hint", "/mdt · /renfort [msg] · /m texte (mégaphone) · /recherche id 1-6 raison · /effacer id · /badge · /barrage · /retirerbarrage" + (t === 6 || t === 1 ? " · /dossier Prenom_Nom note" : "") + (t === 9 ? " · /alerte texte" : "") + " · outils de police : main sur un joueur"));
  }

  /* ---------- rendu ---------- */
  function render() {
    renderFrame();
    const m = $("mainIn");
    const keepScroll = m.dataset.v === S.v ? m.scrollTop : 0;
    m.innerHTML = "";
    m.dataset.v = S.v;
    if (S.loading) { m.appendChild(el("div", "loading", "Chargement…")); return; }
    if (S.v === "anim") viewAnim(m);
    else if (S.v === "bill") viewBill(m);
    else if (S.v === "ads") viewAds(m);
    else if (S.v === "sos") viewSos(m);
    else if (S.v === "me") viewMe(m);
    else if (S.v === "promo") viewPromo(m);
    else if (S.v === "law") viewLaw(m);
    else viewHub(m);
    m.scrollTop = keepScroll;
  }

  function goView(v) {
    if (v === S.v) { send("refresh"); return; }
    S.v = v; render();
    send("view", v);
  }

  /* ---------- evenements ---------- */
  document.querySelectorAll("#nav button").forEach((b) => b.addEventListener("click", () => goView(b.dataset.view)));
  $("gear").addEventListener("click", () => send("refresh"));
  $("quit").addEventListener("click", () => { if (bridge && typeof bridge.close === "function") { try { bridge.close(); } catch (_) {} } });

  function apply(d) {
    if (d.loading) { S.loading = true; render(); return; }
    S.loading = false;
    if (d.me) S.me = d.me;
    if (d.cnt) S.cnt = d.cnt;
    if (d.v === "hub" && d.hub) { S.hub = d.hub; if (d.hub.anim !== undefined) S.cur = d.hub.anim; }
    if (d.v === "anim") S.cur = d.cur || "";
    if (d.v === "bill") {
      S.bin = Array.isArray(d.in) ? d.in : []; S.bout = Array.isArray(d.out) ? d.out : []; S.near = Array.isArray(d.near) ? d.near : [];
      S.forFac = d.for || ""; S.max = Number(d.max) || 1000000;
      const to = Number(d.to);
      if (to >= 0 && to < 1000 && S.lastTo !== to && S.near.some((p) => Number(p[0]) === to)) { S.billTo = to; S.billTab = "new"; }
      S.lastTo = to;
      if (Number(d.ok) === 1 && d.msg && /envoy/i.test(d.msg)) S.billTab = "out";
    }
    if (d.v === "ads") { S.ads = Array.isArray(d.list) ? d.list : []; S.price = Number(d.price) || 150; S.cd = Number(d.cd) || 0; S.cdAt = Date.now(); }
    if (d.v === "sos") { S.calls = Array.isArray(d.calls) ? d.calls : []; S.my = Array.isArray(d.my) ? d.my : 0; }
    if (d.v === "me" && d.p) S.p = d.p;
    if (d.v === "promo" && d.pr) S.pr = d.pr;
    if (d.v === "law" && d.law) S.law = d.law;
    if (d.v && d.v !== S.v) S.v = d.v;
    render();
    if (d.msg) toast(d.msg, Number(d.ok) === 1);
  }

  window.RpApp = {
    openFromNative(raw) { const d = parse(raw); if (d.v) S.v = d.v; apply(d); },
    onUpdateFromNative(raw) { apply(parse(raw)); }
  };

  /* Apercu navigateur (hors jeu) */
  if (!bridge) {
    const now = Math.floor(Date.now() / 1000);
    const me = { n: "Awa Diallo", u: "Awa_Diallo", cash: 12500, bank: 84000, svc: "medic", fac: "Hopital de Crestwood", rk: "Interne", inFac: 1, adm: 0, law: 1, lawT: 6 };
    const cnt = { bills: 2, calls: 1 };
    const demo = {
      hub: { v: "hub", me, cnt, hub: { gov: 0, veh: 1, anim: "" } },
      anim: { v: "anim", me, cnt, cur: "danse2" },
      bill: { v: "bill", me, cnt, in: [[4, "Marc_Kone", 3500, "Reparation moteur", now - 600, "Garage Mecano"], [5, "Ibra_Ndiaye", 1500, "Course taxi aeroport", now - 7200, ""]],
        out: [[2, "Moussa_Sow", 8000, "Soins urgence", now - 3600, 1], [3, "Fatou_Ba", 2000, "Consultation", now - 400, 0]], near: [[3, "Moussa Sow"], [7, "Fatou Ba"]], to: -1, for: "Hopital de Crestwood", max: 1000000 },
      ads: { v: "ads", me, cnt, list: [[9, "vente", "Ibra_Ndiaye", "Vends Sultan noir tres propre, 45 000 FCFA, appelez-moi", now - 120], [8, "emploi", "Marc_Kone", "Le garage recrute 2 mecaniciens motives, passez au garage", now - 3000], [7, "event", "Fatou_Ba", "Soiree plage samedi 21h a Santa Maria, venez nombreux", now - 9000]], price: 150, cd: 0 },
      sos: { v: "sos", me, cnt, calls: [[12, 2, "Moussa_Sow", "Blesse par balle pres de la banque", now - 90, 420, "", 0], [11, 2, "Fatou_Ba", "Malaise au marche", now - 600, 1800, "Awa_Diallo", 1]], my: 0 },
      law: { v: "law", me, cnt, law: { ok: 1, type: 6, tn: "FBI", agents: [[2, "Awa_Diallo", "FBI", "Agent special", 0], [5, "Marc_Kone", "Police", "Sergent", 840]], wanted: [[9, "Ibra_Ndiaye", 3, "Braquage mini-banque", "Marc_Kone"]], backup: [[5, "Marc_Kone", now - 60, 840]], notes: [[1, "Ibra_Ndiaye", "Awa_Diallo", "Vu au port avec une Sultan noire", now - 3600]], alert: "", alertTs: 0, bar: 1 } },
      promo: { v: "promo", me, cnt, pr: { adm: 1, used: "", usedPack: 0, codes: [["ANZO", 3, "Anzo_Diman", 12, 600000], ["KOFI10", 1, "Kofi_Mensah", 4, 80000]], log: [[now - 300, "ANZO", "Anzo_Diman", "Awa_Diallo", 3], [now - 5000, "KOFI10", "Kofi_Mensah", "Ibra_Ndiaye", 1]] } },
      me: { v: "me", me, cnt, p: { age: 26, org: "Dakar", lvl: 7, fs: 5, desc: "Blouse blanche, badge de l'hopital", don: 1, lic: [1, 0, 0, 1], wl: 0, hp: 92, skin: 9 } }
    };
    const v = (location.hash || "#hub").slice(1);
    window.RpApp.openFromNative(demo[v] || demo.hub);
    window.SampRp = null;
    // en apercu, la navigation charge la vue de demo
    const origSend = send;
    document.querySelectorAll("#nav button").forEach((b) => b.addEventListener("click", () => { const dv = demo[b.dataset.view]; if (dv) window.RpApp.onUpdateFromNative(dv); }));
    void origSend;
  }
  try { if (bridge && typeof bridge.ready === "function") bridge.ready(); } catch (_) {}
})();
</script>
</body>
</html>
