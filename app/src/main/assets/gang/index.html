<!DOCTYPE html>
<html lang="fr" data-th="green" data-sg>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Gangs</title>
<!--
  Panneau des gangs Crestwood : classement de la saison, carte des territoires, gestion du gang.
  Serveur -> page : GangApp.openFromNative(json) / GangApp.onUpdateFromNative(json) / GangApp.closeFromNative()
                    (dialogues "@gang" 9720 ouvrir / 9721 mise a jour / 9722 fermer, intercepts par SAMP.java)
  Page -> serveur : SampGang.action(type, {"arg":"..."}) -> /gangact <type> <arg>   (liste blanche cote Java)
                    SampGang.close()  SampGang.ready()
  Le serveur re-verifie tout (gang, grade, presence dans la zone) a chaque action.
-->
<link rel="stylesheet" href="gang.css">
<link rel="stylesheet" href="../common/crestwood-theme.css" />
  <link rel="stylesheet" href="../common/cw-pro.css">
  <link rel="stylesheet" href="../common/cw-perf.css">
<link rel="stylesheet" href="../common/cw-signal.css">
</head>
<body>
<main class="app" id="app" hidden>
  <header class="top">
    <button class="round" id="close" type="button" aria-label="Fermer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <img class="brand" src="../hud/crestwood-roleplay.png" alt="Crestwood RP">
    <div class="title">
      <h1>Guerre des territoires</h1>
      <small id="season">Saison 1 · classement en direct</small>
    </div>
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="war" aria-selected="true">Territoires</button>
      <button type="button" role="tab" data-tab="crew" aria-selected="false" id="tabCrew">Mon gang</button>
    </nav>
    <div class="pill"><span class="live" aria-hidden="true"></span><small>Fin de saison</small><b id="timer">--</b></div>
  </header>

  <!-- Onglet 1 : classement + carte -->
  <section class="view" data-view="war">
    <div class="glass board" aria-label="Classement des gangs">
      <div class="ph"><span>Classement</span><span id="cnt"></span></div>
      <div class="rows" id="rows"></div>
      <div class="info" id="info"></div>
      <div class="feed" id="feed"></div>
    </div>
    <div class="glass mapp" aria-label="Carte des territoires de San Fierro">
      <div class="mapw" id="mapw">
        <svg class="map" id="map" viewBox="0 0 1800 1960" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="map-title">San Fierro</div>
        <div class="zoom">
          <button type="button" data-zoom="in" aria-label="Zoomer">+</button>
          <button type="button" data-zoom="out" aria-label="Dézoomer">−</button>
          <button type="button" data-zoom="reset" aria-label="Voir toute la carte">⤢</button>
        </div>
        <div class="legend"><span><i class="lg-war"></i>En guerre</span><span><i class="lg-hq"></i>QG (emblème)</span><span id="here"></span></div>
      </div>
    </div>
  </section>

  <!-- Onglet 2 : mon gang -->
  <section class="view crew" data-view="crew" hidden>
    <div class="glass card-gang" id="crewCard"></div>
    <div class="glass members">
      <div class="ph"><span>Membres</span><span id="mcount"></span></div>
      <div class="mlist" id="mlist"></div>
      <form class="invite" id="invite" autocomplete="off">
        <input id="inviteId" type="text" inputmode="numeric" maxlength="4" placeholder="ID du joueur" aria-label="ID du joueur à inviter">
        <button class="chip-btn ok" type="submit"><span class="ico"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>Inviter</button>
      </form>
    </div>
  </section>

  <div class="toast" id="toast" role="status" hidden></div>
</main>
<script src="gang.js"></script>
</body>
</html>
