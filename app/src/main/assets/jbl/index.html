<!DOCTYPE html>
<html lang="fr" data-sg>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Enceinte JBL</title>
<!--
  Enceinte JBL : serveur -> page JblApp.openFromNative(json) / onUpdateFromNative(json) ("@jbl" 9850/9851, 9852 = fermer)
  json : {mode:0 rangee|1 en main|2 au sol, url, near, has, ok, msg}
  page -> serveur : SampJbl.action(type, {"arg": "..."}) -> /jblact take|play <lien>|stop|drop|store
-->
<style>
:root{--bg:rgba(0,0,0,0.576);--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--text:#f4f4f4;--muted:#9a9a9a;--accent:#ff6a00;
  --font:"Inter","Poppins","Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:transparent;font-family:var(--font);color:var(--text);-webkit-user-select:none;user-select:none}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.ov{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.3)}
.panel{width:min(94vw,520px);max-height:94vh;overflow-y:auto;display:flex;flex-direction:column;gap:clamp(8px,2vh,12px);padding:clamp(12px,3vh,18px);border-radius:4px;background:var(--bg);border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,0.48);scrollbar-width:none}
.head{display:flex;align-items:center;gap:12px}
.logo{width:clamp(40px,10vh,54px);height:clamp(40px,10vh,54px);border-radius:4px;display:grid;place-items:center;background:linear-gradient(135deg,#ff7a00,#ff3d00);font-weight:900;font-size:clamp(12px,3.2vh,16px);letter-spacing:.04em;color:#fff;box-shadow:0 8px 24px rgba(255,90,0,.35)}
.head h1{font-size:clamp(15px,4vh,19px);font-weight:800}
.head p{font-size:clamp(9.5px,2.4vh,11.5px);color:var(--muted)}
.x{margin-left:auto;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.08)}
.status{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:4px;background:var(--card)}
.eq{display:flex;align-items:flex-end;gap:3px;height:22px}
.eq i{width:4px;background:var(--accent);border-radius:2px;height:4px}
.playing .eq i{animation:eq 0.9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}.eq i:nth-child(4){animation-delay:.45s}
@keyframes eq{0%,100%{height:4px}50%{height:22px}}
.status b{font-size:clamp(11px,2.8vh,13px)}
.status small{display:block;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
.row{display:flex;gap:6px}
.in{flex:1;min-width:0;padding:10px 12px;border-radius:4px;background:rgba(255,255,255,.07);border:1px solid var(--line);outline:none;font-size:12.5px;-webkit-user-select:text;user-select:text}
.in:focus{border-color:rgba(255,255,255,.5)}
.btn{padding:10px 14px;border-radius:4px;font-size:12px;font-weight:800;background:rgba(255,255,255,.09);border:1px solid var(--line);white-space:nowrap}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.35}
.sec{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.radios{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.radio{padding:9px 10px;border-radius:4px;background:var(--card);border:1px solid var(--line);text-align:left;font-size:11.5px;font-weight:700}
.radio small{display:block;font-size:9.5px;color:var(--muted);font-weight:500}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.toast{position:fixed;left:50%;bottom:3vh;transform:translateX(-50%);max-width:86vw;padding:8px 14px;border-radius:4px;background:rgba(0,0,0,0.58);border:1px solid var(--line);font-size:12px;opacity:0;transition:.2s;pointer-events:none;text-align:center}
.toast.show{opacity:1}.toast.err{color:#ffc5cc}.toast.ok{color:#bff3d1}
</style>
  <link rel="stylesheet" href="../common/cw-pro.css">
  <link rel="stylesheet" href="../common/cw-perf.css">
<link rel="stylesheet" href="../common/cw-signal.css">
</head>
<body>
<main class="ov">
  <section class="panel" id="panel">
    <header class="head">
      <div class="logo">JBL</div>
      <div><h1>Enceinte JBL</h1><p id="state">—</p></div>
      <button class="x" id="close" type="button" aria-label="Fermer">&#10005;</button>
    </header>
    <div class="status" id="status">
      <div class="eq"><i></i><i></i><i></i><i></i></div>
      <div><b id="now">Aucune musique</b><small id="url"></small></div>
    </div>
    <div class="sec">Lien de la musique (radio, mp3, flux)</div>
    <div class="row">
      <input class="in" id="link" type="url" inputmode="url" placeholder="https://..." maxlength="110" autocomplete="off">
      <button class="btn main" id="play" type="button">Jouer</button>
    </div>
    <div class="sec" id="recentTitle">Derniers liens</div>
    <div class="radios" id="radios"></div>
    <div class="acts">
      <button class="btn" id="stop" type="button">Stop</button>
      <button class="btn" id="drop" type="button">Poser au sol</button>
      <button class="btn" id="take" type="button">Prendre</button>
    </div>
    <button class="btn" id="store" type="button">Ranger dans le sac</button>
  </section>
</main>
<div class="toast" id="toast"></div>
<script>
(function () {
  "use strict";
  const bridge = window.SampJbl || null;
  const $ = (id) => document.getElementById(id);
  // derniers liens joues (memorises sur ce telephone)
  const KEY = "cwJblRecent";
  function recent() { try { return JSON.parse(localStorage.getItem(KEY) || "[]").slice(0, 6); } catch (_) { return []; } }
  function remember(url) { try { const l = recent().filter((u) => u !== url); l.unshift(url); localStorage.setItem(KEY, JSON.stringify(l.slice(0, 6))); } catch (_) {} }
  let S = { mode: 0, url: "", near: 0, has: 1 };
  function send(t, arg) {
    if (!bridge || typeof bridge.action !== "function") { console.log("[jbl]", t, arg); return; }
    try { bridge.action(t, JSON.stringify({ arg: arg == null ? "" : String(arg) })); } catch (_) {}
  }
  let tt = 0;
  function toast(m, ok) { if (!m) return; const t = $("toast"); t.textContent = m; t.className = "toast show " + (ok ? "ok" : "err"); clearTimeout(tt); tt = setTimeout(() => { t.className = "toast"; }, 2800); }
  function render() {
    const modes = ["Rangée dans le sac", "En main", "Posée au sol"];
    $("state").textContent = modes[S.mode] || "—";
    const playing = !!S.url && S.mode > 0;
    $("status").classList.toggle("playing", playing);
    $("now").textContent = playing ? "Musique en cours" : "Aucune musique";
    $("url").textContent = S.url || "";
    $("play").disabled = S.mode === 0;
    $("stop").disabled = !S.url;
    $("drop").disabled = S.mode !== 1;
    $("take").disabled = !(S.mode === 0 || (S.mode === 2 && S.near));
    $("store").disabled = S.mode === 0 || (S.mode === 2 && !S.near);
  }
  function renderRecent() {
    const box = $("radios"); box.innerHTML = "";
    const list = recent();
    $("recentTitle").style.display = list.length ? "" : "none";
    list.forEach((url) => {
      const b = document.createElement("button"); b.type = "button"; b.className = "radio";
      const host = url.replace(/^https?:\/\//i, "").split("/")[0];
      b.textContent = host; const sm = document.createElement("small"); sm.textContent = url.slice(-28); b.appendChild(sm);
      b.addEventListener("click", () => { if (S.mode === 0) return toast("Prends d'abord ta JBL.", 0); send("play", url); });
      box.appendChild(b);
    });
  }
  renderRecent();
  $("play").addEventListener("click", () => {
    const v = $("link").value.trim();
    if (!/^https?:\/\/\S{4,}$/i.test(v)) return toast("Le lien doit commencer par http:// ou https://", 0);
    send("play", v); remember(v); renderRecent();
  });
  $("stop").addEventListener("click", () => send("stop"));
  $("drop").addEventListener("click", () => send("drop"));
  $("take").addEventListener("click", () => send("take"));
  $("store").addEventListener("click", () => send("store"));
  $("close").addEventListener("click", () => { if (bridge && typeof bridge.close === "function") { try { bridge.close(); } catch (_) {} } });
  function apply(raw) {
    let d = raw; if (typeof d === "string") { try { d = JSON.parse(d); } catch (_) { d = null; } }
    if (!d) return;
    S = Object.assign(S, d); S.mode = Number(S.mode) || 0;
    render();
    if (d.msg) toast(d.msg, Number(d.ok) === 1);
  }

  // clavier Android : la WebView doit devenir focalisable avant de toucher un champ
  document.addEventListener("pointerdown", (e) => {
    const el = e.target && e.target.closest && e.target.closest("input");
    if (!el || !bridge || typeof bridge.showKeyboard !== "function") return;
    try { bridge.showKeyboard(); } catch (_) {}
    setTimeout(() => { try { el.focus(); } catch (_) {} }, 60);
  }, true);
  window.JblApp = { openFromNative: apply, onUpdateFromNative: apply };
  if (!bridge) apply({ mode: 1, url: "", near: 0, has: 1 });
  try { if (bridge && typeof bridge.ready === "function") bridge.ready(); } catch (_) {}
})();
</script>
</body>
</html>
