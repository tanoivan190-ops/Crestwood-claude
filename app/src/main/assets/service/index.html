<!DOCTYPE html>
<html lang="fr" data-th="green">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Service</title>
<!--
  Service de faction Crestwood : le panneau s'adapte au metier (medecins, mecanos, taxis, journalistes,
  Burger Shot, concession, armee, organisation, tueurs a gages, police / FBI / gouvernement).
  Serveur -> page : SvcApp.openFromNative(json) / SvcApp.onUpdateFromNative(json)   ("@svc" 9750-9752)
  Page -> serveur : SampSvc.action(type, {"arg":"..."}) -> /svcact <type> <arg>   (liste blanche cote Java)
  Vue "offer" : un vendeur (Burger Shot / concession) propose un article au joueur, qui accepte ou refuse.
-->
<link rel="stylesheet" href="crestwood-ui.css">
<style>
  .top .duty { cursor: pointer; }
  .top .duty i { width: 9px; height: 9px; border-radius: 50%; background: #7e7e7e; box-shadow: 0 0 0 3px rgba(126,126,126,0.2); }
  .top .duty.on { border-color: rgba(133,133,133,0.6); }
  .top .duty.on i { background: var(--green); box-shadow: 0 0 10px var(--green); }
  .view { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, .75fr); gap: 1.4vw; }
  .col { display: flex; flex-direction: column; min-height: 0; padding: 1.8vh 1.3vw; gap: 1.2vh; }
  .hero { flex: none; display: flex; align-items: center; gap: 12px; padding: 1.2vh 12px; border-radius: 4px;
    background: linear-gradient(100deg, rgba(128, 128, 128, 0.22), rgba(255,255,255,.02)); background: linear-gradient(100deg, color-mix(in srgb, var(--c) 22%, transparent), rgba(255,255,255,.02)) /*cw*/; border: 1px solid rgba(128, 128, 128, 0.22); border: 1px solid color-mix(in srgb, var(--c) 40%, transparent) /*cw*/; }
  .hero .badge { flex: none; width: 9vh; width: clamp(38px, 9vh, 50px) /*cw*/; aspect-ratio: 1; border-radius: 4px; display: grid; place-items: center; background: rgba(128, 128, 128, 0.22); background: color-mix(in srgb, var(--c) 28%, rgba(0,0,0,.3)) /*cw*/; height: 9vh; /*cw*/ }
  .hero .badge svg { width: 58%; height: 58%; fill: var(--c); }
  .hero b { display: block; font-size: 3.2vh; font-size: clamp(13px, 3.2vh, 17px) /*cw*/; font-weight: 900; }
  .hero small { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .hero .stat { margin-left: auto; text-align: right; }
  .hero .stat b { font-size: 3.6vh; font-size: clamp(14px, 3.6vh, 19px) /*cw*/; color: var(--c); font-variant-numeric: tabular-nums; }
  .sec { flex: none; font-size: 10.5px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: center; margin-top: .4vh; }
  .list { display: grid; gap: 6px; align-content: start; }
  .row { display: flex; align-items: center; gap: 10px; padding: .9vh 10px; border-radius: 4px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.06); }
  .row .av { flex: none; width: 32px; height: 32px; border-radius: 4px; display: grid; place-items: center; font-size: 12px; font-weight: 900; background: rgba(128, 128, 128, 0.22); background: color-mix(in srgb, var(--c) 22%, transparent) /*cw*/; color: var(--c); }
  .row .t { flex: 1; min-width: 0; }
  .row .t b { display: block; font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .t small { display: block; font-size: 11px; color: var(--muted); }
  .row .acts { flex: none; display: flex; gap: 6px; }
  .bar { height: 5px; margin-top: 4px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 3px; background: var(--green); }
  .bar i.low { background: var(--red); } .bar i.mid { background: var(--gold); }
  .mini { height: 32px; padding: 0 12px; border-radius: 3px; font-size: 11.5px; font-weight: 800; border: 1px solid rgba(133,133,133,0.5); background: rgba(133,133,133,0.12); color: #e9fff4; white-space: nowrap; }
  .mini.ghost { border-color: var(--line-strong); background: rgba(255,255,255,.06); }
  .mini.red { border-color: rgba(255,77,77,.55); background: rgba(255,77,77,.14); }
  .mini.gold { border-color: rgba(245,196,81,.6); background: rgba(245,196,81,.14); }
  .mini:active { transform: scale(.94); }
  .mini:disabled { opacity: .4; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, min17vw); grid-template-columns: repeat(auto-fill, minmax(clamp(120px, 17vw, 168px), 1fr)) /*cw*/; gap: 8px; }
  .item { display: flex; flex-direction: column; gap: 4px; padding: 1.1vh 11px; border-radius: 4px; text-align: left; background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.07); }
  .item b { font-size: 12.5px; font-weight: 800; }
  .item small { font-size: 11px; color: var(--muted); }
  .item .p { font-size: 13px; font-weight: 900; color: var(--gold); font-variant-numeric: tabular-nums; }
  .item.on { border-color: var(--c); background: rgba(128, 128, 128, 0.22); background: color-mix(in srgb, var(--c) 14%, transparent) /*cw*/; box-shadow: 0 0 0 1px var(--c) inset; }
  .item:active { transform: scale(.97); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { height: 32px; padding: 0 12px; border-radius: 3px; font-size: 11.5px; font-weight: 800; background: rgba(255,255,255,.06); border: 1px solid var(--line); color: var(--muted); }
  .chip.on { color: #ffffff; background: linear-gradient(145deg, var(--green), var(--green-deep)); border-color: transparent; }
  .inline { display: flex; gap: 8px; align-items: center; }
  .note { font-size: 11.5px; color: var(--muted); line-height: 1.45; }
  .big { font-size: 6vh; font-size: clamp(20px, 6vh, 34px) /*cw*/; font-weight: 900; font-variant-numeric: tabular-nums; }
  .meter { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 1.2vh 14px; border-radius: 4px; background: rgba(0,0,0,.25); border: 1px solid var(--line); }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 900; letter-spacing: .1em; color: #ff8a3d; }
  .live i { width: 9px; height: 9px; border-radius: 50%; background: #ff8a3d; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  textarea.field { height: auto; min-height: 64px; padding: 10px 14px; border-radius: 4px; resize: none; line-height: 1.4; }
  textarea { font: inherit; color: inherit; }
  .offer { margin: auto; width: 92vw; width: min(92vw, 460px) /*cw*/; max-height: 100%; overflow-y: auto; padding: 2.2vh 22px; display: flex; flex-direction: column; align-items: center; gap: 1vh; text-align: center; }
  .offer .badge { flex: none; width: 12vh; width: clamp(44px, 12vh, 64px) /*cw*/; height: 12vh; height: clamp(44px, 12vh, 64px) /*cw*/; border-radius: 4px; display: grid; place-items: center; background: rgba(128, 128, 128, 0.22); background: color-mix(in srgb, var(--c) 26%, transparent) /*cw*/; }
  .offer .badge svg { width: 56%; height: 56%; fill: var(--c); }
  .offer h2 { font-size: 4vh; font-size: clamp(16px, 4vh, 21px) /*cw*/; font-weight: 900; }
  .offer p { font-size: 13px; color: var(--muted); }
  .offer .price { font-size: 5.6vh; font-size: clamp(20px, 5.6vh, 30px) /*cw*/; font-weight: 900; color: var(--gold); }
  .offer .row2 { display: flex; gap: 10px; margin-top: .6vh; }
  .ttl { font-size: 11px; color: var(--muted); }
  .offer .foot { font-size: 11px; }
  @media (max-width: 760px) { .view { grid-template-columns: 1fr; } .col.side { display: none; } }
</style>
<link rel="stylesheet" href="../common/crestwood-theme.css" />
  <link rel="stylesheet" href="../common/cw-pro.css">
  <link rel="stylesheet" href="../common/cw-perf.css">
</head>

<main class="app" id="app" hidden>
  <header class="top">
    <button class="round" id="close" type="button" aria-label="Fermer"><svg><use href="#i-x"/></svg></button>
    <img class="brand" src="../hud/crestwood-roleplay.png" alt="Crestwood RP">

    <button class="pill duty" id="duty" type="button" hidden><i></i><b id="dutyTxt">Hors service</b></button>
    <div class="pill"><small>Liquide</small><b id="cash" class="num">0 FCFA</b></div>
